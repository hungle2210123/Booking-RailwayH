{% extends "base.html" %}

{% block title %}Quản lý Căn hộ & Phòng{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="alert alert-success">
        <h4><i class="fas fa-magic"></i> Hệ thống Tự động Hoàn toàn!</h4>
        <p class="mb-0">✅ Thêm căn hộ/phòng → Tất cả tự động cập nhật (lịch, doanh thu, dashboard)!</p>
    </div>

    <div class="card border-primary mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="fas fa-building"></i> Quản lý Căn hộ & Phòng</h4>
        </div>
        <div class="card-body">
            <button class="btn btn-success btn-lg mb-3" onclick="showAddApartmentModal()">
                <i class="fas fa-plus"></i> Thêm Căn hộ Mới
            </button>
            <div id="apartmentsList"></div>
        </div>
    </div>
</div>

<!-- Modals and scripts will be added in next commit -->
{% endblock %}
