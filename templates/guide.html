<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{% if data %}{{ data.name }} · Guest guide{% else %}Guest guide{% endif %}</title>
<style>
:root{--ink:#111;--sub:#555;--mute:#888;--line:#e5e5e5;--bg:#f6f6f4;--card:#fff;--red:#C62828;--redbg:#FDECEC;
  --amb:#B45309;--ambbg:#FFF7E6;--grn:#15803D;--grnbg:#EAF7EE;--acc:#111}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:21px;margin:0;flex:1;line-height:1.2}
header h1 small{display:block;font-size:13px;color:var(--mute);font-weight:500}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:none;padding:7px 12px;font:600 14px inherit;color:var(--sub)}
.lang button.on{background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;text-align:left;
  font:inherit;color:inherit;cursor:pointer;min-height:104px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:16px}.tile span{font-size:13px;color:var(--sub)}
.tile i{font-style:normal;font-size:28px;line-height:1}
.tile.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;scroll-margin-top:12px}
.sec h2{margin:0 0 2px;font-size:19px;display:flex;gap:8px;align-items:center}
.sec .ln{color:var(--sub);font-size:14px;margin:0 0 12px}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.step .t{flex:1;font-size:16px}
.pic{flex:none;width:74px;height:74px;border-radius:12px;background:#f1f1ef;display:grid;place-items:center}
.box{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;font-weight:600}
.tip{background:var(--grnbg);color:var(--grn)}.warn{background:var(--redbg);color:var(--red)}
.ask{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;font-size:15px}
.ask button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 15px inherit}
.ask .ok{color:var(--grn)}.ask .no{color:var(--red)}
.msg{margin-top:10px;font-size:15px;color:var(--sub)}
/* remote / keypad / breaker pictures */
.rm{width:40px;background:#2b2b2b;border-radius:10px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.rm u{text-decoration:none;width:24px;height:16px;border-radius:5px;background:#555;color:#ddd;font-size:10px;display:grid;place-items:center}
.rm u.hi{background:#fff;color:#111;box-shadow:0 0 0 2px #22c55e}
.rm u.hi2{background:#fde68a;color:#111;box-shadow:0 0 0 2px #f59e0b}
.kp{display:grid;grid-template-columns:repeat(3,14px);gap:3px}
.kp u{text-decoration:none;height:12px;border-radius:3px;background:#cfcfcb;font-size:8px;display:grid;place-items:center;color:#444}
.kp u.hi{background:#111;color:#fff}
.br{display:flex;gap:4px;background:#ddd;padding:6px;border-radius:6px}
.br u{width:9px;height:30px;background:#fff;border-radius:2px;position:relative}
.br u:after{content:"";position:absolute;left:1px;right:1px;top:2px;height:11px;background:#15803D;border-radius:1px}
.big{font-size:34px}
/* food */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 14px inherit;color:var(--sub)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fd{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.fd .e{font-size:26px;line-height:1;flex:none;width:34px;text-align:center}
.fd .b{flex:1;min-width:0}.fd .b b{display:block}
.fd .b span{display:block;font-size:13px;color:var(--sub)}
.fd .act{display:flex;flex-direction:column;gap:6px;flex:none}
.fd a,.fd button.sv{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font:600 13px inherit;color:var(--ink);text-decoration:none;text-align:center}
.fd button.sv.on{background:var(--ambbg);border-color:#f3d39b;color:var(--amb)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.top{display:block;text-align:center;margin-top:18px;color:var(--sub);font-size:14px}
.apts{display:grid;gap:10px}
.apts a{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;font-size:18px;font-weight:700;color:var(--ink);text-decoration:none}
@media print{.lang,.tiles,.ask,.top,.chips,.fd .act{display:none!important}body{background:#fff}.sec{break-inside:avoid;border-color:#bbb}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = {{ data|tojson }};
const APTS = {{ apts|tojson }};
const T = {
  en:{guide:'Guest guide', still:'Yes, still none', choose:'Choose your apartment', step:'Step', yes:'Yes, it works', no:'No',
      noMsg:'Please message us on the app you booked with (Booking.com / Airbnb / WhatsApp) — we will help right away.',
      all:'All', saved:'★ My list', save:'☆ Save', savedB:'★ Saved', map:'Map', top:'↑ Back to top',
      none:'No places saved yet — tap ☆ Save.', foodNote:'Prices and opening hours change — check the map before you go.',
      when:{m:'Breakfast',a:'Lunch',e:'Dinner'}, kinds:{pho:'Phở',bun:'Noodles · bún',banhcuon:'Rice rolls',rice:'Rice · xôi',fish:'Chả cá',coffee:'Coffee'},
      open:'Open', price:'About'},
  vi:{guide:'Hướng dẫn cho khách', still:'Đúng, vẫn chưa có', choose:'Chọn căn của bạn', step:'Bước', yes:'Có rồi', no:'Chưa',
      noMsg:'Bạn nhắn cho mình qua ứng dụng đã đặt phòng (Booking.com / Airbnb / WhatsApp / Zalo) — mình hỗ trợ ngay.',
      all:'Tất cả', saved:'★ Đã lưu', save:'☆ Lưu', savedB:'★ Đã lưu', map:'Bản đồ', top:'↑ Lên đầu trang',
      none:'Chưa lưu quán nào — chạm ☆ Lưu.', foodNote:'Giá và giờ mở cửa có thể thay đổi — xem bản đồ trước khi đi.',
      when:{m:'Ăn sáng',a:'Ăn trưa',e:'Ăn tối'}, kinds:{pho:'Phở',bun:'Bún',banhcuon:'Bánh cuốn',rice:'Cơm · xôi',fish:'Chả cá',coffee:'Cà phê'},
      open:'Mở', price:'Khoảng'}
};
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
let L = store.get('hd_lang', null) || ((navigator.language||'').toLowerCase().startsWith('vi') ? 'vi' : 'en');
let open = null, fKind = 'all';
let saved = store.get('hd_food', []);
const qs = new URLSearchParams(location.search);
if (qs.get('s')) open = qs.get('s');
if (qs.get('lang') === 'vi' || qs.get('lang') === 'en') L = qs.get('lang');

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tx = o => o ? (o[L] || o.en || '') : '';

function pic(p){
  const rm = (a,b) => `<div class="rm"><u class="${a==='up'?'hi':''} ${b==='up'?'hi2':''}">▲</u><u class="${a==='stop'?'hi':''} ${b==='stop'?'hi2':''}">■</u><u class="${a==='down'?'hi':''}">▼</u></div>`;
  switch(p){
    case 'up': return rm('up');
    case 'down': return rm('down');
    case 'stop': return rm('stop');
    case 'stop_up': return `<div style="display:flex;align-items:center;gap:3px">${rm('stop')}<b style="font-size:13px">→</b>${rm('up')}</div>`;
    case 'keypad': return `<div class="kp">${[1,2,3,4,5,6,7,8,9,'*',0,'#'].map((d,i)=>`<u class="${i===4?'hi':''}">${d}</u>`).join('')}</div>`;
    case 'breaker': return `<div class="br"><u></u><u></u><u></u><u></u></div>`;
    case 'wait': return `<span class="big">⏳</span>`;
    case 'washer': return `<span class="big">🧺</span>`;
    case 'clock': return `<span class="big">🕛</span>`;
    case 'off': return `<span class="big">💡</span>`;
    case 'key_room': return `<span class="big">🔑</span>`;
    case 'key_shelf': return `<span class="big">🗝️</span>`;
    case 'wifi': return `<span class="big">📶</span>`;
  }
  return '';
}

function foodHtml(list){
  const t = T[L];
  if (!list.length) return '';
  const kinds = [...new Set(list.map(f => f.kind))];
  let rows = list.filter(f => fKind==='all' || (fKind==='saved' ? saved.includes(f.name) : f.kind===fKind));
  const chips = [['all',t.all], ...kinds.map(k => [k, t.kinds[k]||k]), ['saved', t.saved]]
    .map(([k,lab]) => `<button class="${fKind===k?'on':''}" onclick="H.kind('${k}')">${esc(lab)}</button>`).join('');
  const body = rows.length ? rows.map(f => {
    const on = saved.includes(f.name);
    const meta = [f.dish ? tx(f.dish) : '', f.addr, f.price ? t.price+' '+f.price : ''].filter(Boolean).map(esc).join(' · ');
    return `<div class="fd"><div class="e">${f.emoji||'🍽'}</div><div class="b"><b>${esc(f.name)}</b><span>${meta}</span>${f.why?`<span>${esc(tx(f.why))}</span>`:''}</div>
      <div class="act"><a href="${esc(f.map)}" target="_blank" rel="noopener">📍 ${t.map}</a><button class="sv ${on?'on':''}" onclick="H.save(${JSON.stringify(f.name).replace(/"/g,'&quot;')})">${on?t.savedB:t.save}</button></div></div>`;
  }).join('') : `<div class="msg">${t.none}</div>`;
  return `<div class="chips">${chips}</div>${body}<div class="note">${t.foodNote}</div>`;
}

function secHtml(s){
  const t = T[L];
  let h = `<section class="sec" id="s-${s.id}"><h2>${s.icon} ${esc(tx(s.title))}</h2><p class="ln">${esc(tx(s.line))}</p>`;
  (s.steps||[]).forEach(([p, txt], i) => {
    h += `<div class="step"><div class="n">${i+1}</div><div class="t">${esc(tx(txt))}</div>${p?`<div class="pic">${pic(p)}</div>`:''}</div>`;
  });
  if (s.tip) h += `<div class="box tip">✓ ${esc(tx(s.tip))}</div>`;
  if (s.warn) h += `<div class="box warn">⚠ ${esc(tx(s.warn))}</div>`;
  if (s.ask) h += `<div class="ask"><span>${esc(tx(s.ask))}</span><button class="no" onclick="H.help('${s.id}')">${t.still}</button></div><div class="msg" id="help-${s.id}" hidden>${t.noMsg}</div>`;
  if (s.id === 'food') h += foodHtml(DATA.food || []);
  return h + `</section>`;
}

function render(){
  const t = T[L];
  document.documentElement.lang = L;
  const langBtn = `<div class="lang"><button class="${L==='en'?'on':''}" onclick="H.lang('en')">EN</button><button class="${L==='vi'?'on':''}" onclick="H.lang('vi')">VI</button></div>`;
  if (!DATA){
    document.getElementById('app').innerHTML = `<header><h1>${t.guide}<small>${t.choose}</small></h1>${langBtn}</header>
      <div class="apts">${APTS.map(a => `<a href="/hd/${a.key}">🏠 ${esc(a.name)}</a>`).join('')}</div>`;
    return;
  }
  const secs = DATA.secs.filter(s => s.id !== 'food' || (DATA.food||[]).length);
  const tiles = secs.map(s => `<button class="tile ${open===s.id?'on':''}" onclick="H.go('${s.id}')"><i>${s.icon}</i><b>${esc(tx(s.title))}</b><span>${esc(tx(s.line))}</span></button>`).join('');
  document.getElementById('app').innerHTML = `<header><h1>${esc(DATA.name)}<small>${t.guide}</small></h1>${langBtn}</header>
    <div class="tiles">${tiles}</div>${secs.map(secHtml).join('')}<a class="top" href="#" onclick="scrollTo({top:0,behavior:'smooth'});return false">${t.top}</a>`;
}

const H = {
  lang(l){ L = l; store.set('hd_lang', l); render(); },
  go(id){ open = id; render(); const el = document.getElementById('s-'+id); if (el) el.scrollIntoView({behavior:'smooth'}); },
  kind(k){ fKind = k; const y = scrollY; render(); scrollTo(0, y); },
  save(n){ saved = saved.includes(n) ? saved.filter(x => x!==n) : saved.concat(n); store.set('hd_food', saved); const y = scrollY; render(); scrollTo(0, y); },
  help(id){ const el = document.getElementById('help-'+id); if (el) el.hidden = false; },
};
render();
if (open) setTimeout(() => { const el = document.getElementById('s-'+open); if (el) el.scrollIntoView(); }, 50);
</script>
</body>
</html>
