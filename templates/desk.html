<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1525">
<title>Hotel Pro — máy tính</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* /may-tinh — the desktop app (owner, Oct 30), built from the approved mockup. Same data and actions as /moi, same revenue
   numbers as /dashboard. Colours: ink sidebar, white cards, apartment colours = the calendar's; red = act now · amber =
   waiting · blue = answered · green = done · grey = unreachable · violet = 2 phòng ngủ. */
*{box-sizing:border-box}
html,body{margin:0;background:#F3F4F7;color:#0E1525;font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:#1D4ED8}
.num{font-variant-numeric:tabular-nums}
.muted{color:#64748B}
.ico{width:18px;height:18px;flex-shrink:0}
#shell{display:flex;min-height:100vh}
/* sidebar */
#side{width:232px;flex-shrink:0;background:#0E1525;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 10px 12px}.brand b{font-size:19px;font-weight:800;letter-spacing:-.3px}.brand div{font-size:12px;color:#A7B0C0;margin-top:2px}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:10px;padding:0 12px;min-height:40px;font-size:14px;font-weight:600;text-align:left;background:transparent;color:#CBD5E1}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(255,255,255,.13);color:#fff}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;background:#DC2626;color:#fff}
.nav .cnt.amber{background:#B45309}
.sdiv{height:1px;background:rgba(255,255,255,.1);margin:8px 8px}
.legend-s{padding:0 10px;font-size:11.5px;color:#CBD5E1;line-height:1.6}.legend-s b{color:#fff;display:block;margin-bottom:2px}
.legend-s div{display:flex;align-items:center;gap:8px}
.slink{display:flex;align-items:center;gap:10px;color:#CBD5E1;text-decoration:none;font-size:13px;padding:7px 10px;border-radius:10px}
.slink:hover{background:rgba(255,255,255,.06);color:#fff}
/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 28px;background:#fff;border-bottom:1px solid #E4E7ED;position:sticky;top:0;z-index:30}
.ttl{flex:1 1 0;min-width:180px}.ttl b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px}.ttl span{display:block;font-size:13px;color:#64748B}
.ttl b,.ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 13px;border-radius:10px;border:1px solid #DDE1E8;background:#fff;color:#0E1525;font-size:13.5px;font-weight:700;white-space:nowrap;text-decoration:none}
.btn:hover{background:#F6F7F9}
.btn.pri{background:#0E1525;color:#fff;border-color:#0E1525}.btn.pri:hover{background:#1E293B}
.btn.ok{background:#15803D;color:#fff;border-color:#15803D}.btn.ok:hover{background:#166534}
.btn.warn{background:#F59E0B;color:#0E1525;border-color:#F59E0B}
.btn.red{color:#B91C1C;border-color:#FECACA}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn.xs{min-height:28px;padding:0 9px;font-size:12px;border-radius:8px}
.btn.busy svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.search{display:flex;align-items:center;gap:8px;background:#F3F4F7;border:1px solid #E4E7ED;border-radius:10px;padding:0 12px;min-height:38px;color:#64748B;width:210px}
.search input{border:none;background:transparent;outline:none;font:inherit;font-size:14px;color:#0E1525;width:100%}
#content{padding:22px 28px 60px;min-width:0}
/* building blocks */
.card{background:#fff;border:1px solid #E4E7ED;border-radius:14px}
.ch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;border-bottom:1px solid #EEF0F4}
.ch h3{margin:0;font-size:15px;font-weight:800}
.stack{display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpis.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{padding:14px 16px}.kpi .l{font-size:12.5px;color:#64748B;font-weight:700}.kpi .v{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:3px;line-height:1.15}
.kpi .s{font-size:12.5px;color:#475569;margin-top:3px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;border:none}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.tb{font-size:10px;font-weight:800;letter-spacing:.3px;color:#fff;background:#6D28D9;border-radius:5px;padding:1px 6px;flex-shrink:0}
.seg{display:inline-flex;background:#E9EBF0;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:none;border-radius:8px;min-height:32px;padding:0 12px;font-size:13px;font-weight:700;background:transparent;color:#475569}
.seg button.on{background:#fff;color:#0E1525;box-shadow:0 1px 3px rgba(14,21,37,.12)}
.empty{padding:22px 16px;text-align:center;font-size:14px;font-weight:600;color:#64748B}
.colh{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:0 8px 4px}
.gr{display:flex;align-items:center;gap:8px;border-radius:8px;padding:2px 4px}
.gr:hover{background:#F4F6F9}
.gr>button.main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:none;background:transparent;text-align:left;padding:7px 4px;color:#0E1525}
.gn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs{font-size:12px;color:#475569;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{flex-shrink:0;min-width:34px;height:30px;border-radius:8px;border:1px solid #E2E5EB;background:#fff;font-size:13px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;gap:3px}
.bell.has{background:#FEF3C7;border-color:#FCD34D;color:#92400E;font-size:11px;font-weight:800}
.chipb{border-radius:10px;min-height:44px;padding:4px 10px;font-size:13px;font-weight:800;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;border:none;color:#fff}
.chipb small{font-size:10.5px;font-weight:600;opacity:.9}
.chipb.off{background:#fff!important;color:#64748B;border:1.5px solid #E2E5EB}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.two{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.two>.l{flex:999 1 560px;min-width:0}.two>.r{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:18px}
/* strip */
.strip{display:grid;grid-template-columns:repeat(14,minmax(60px,1fr));gap:6px;min-width:880px}
.sday{border:none;border-radius:10px;padding:8px 4px;text-align:center;background:#fff;box-shadow:inset 0 0 0 1px #E4E7ED;color:#0E1525}
.sday.we{background:#F7F8FA}.sday.on{background:#0E1525;color:#fff;box-shadow:none}
.sday .w{font-size:11.5px;font-weight:600;opacity:.8}.sday .n{font-size:16px;font-weight:800}.sday .f{font-size:11.5px;font-weight:800;margin-top:2px}
.sday .p{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7C3AED;margin-left:3px;vertical-align:middle}
/* pair board */
.apb{padding:13px 18px 10px;border-top:1px solid #EEF0F4}
.apb:first-of-type{border-top:none}
.aph{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
.cells{display:flex;gap:3px}.cells i{width:13px;height:13px;border-radius:4px;display:inline-block}
.pcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.remrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.remrow:hover{background:#F7F8FA}
/* day page */
.aptst{border-radius:12px;padding:14px}
.dcard{padding:13px 14px 11px;display:flex;flex-direction:column;gap:7px}
.dacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.dlinks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid #F1F2F5;padding-top:8px}
.lk{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#fff;color:#334155;border:1px solid #E2E5EB;text-decoration:none}
.lk:hover{background:#F6F7F9}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;background:#0E1525;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:800}
/* day page (one block per apartment) */
.todo{border:none;border-radius:12px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.todo b{font-size:22px;font-weight:800;line-height:1.1}.todo span{font-size:12.5px;font-weight:700}
.colh2{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#64748B;display:flex;align-items:center;gap:6px;padding:0 2px 2px}
.colh2 i{font-style:normal;border-radius:999px;background:#E9EBF0;color:#334155;padding:0 7px;font-size:11px}
.g2{background:#fff;border:1px solid #E4E7ED;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.g2.dim{opacity:.35}
.room{flex-shrink:0;border:none;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:800;color:#fff;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act2{border:none;border-radius:9px;min-height:32px;padding:0 10px;font-size:12.5px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:32px;height:32px;border-radius:9px;border:1px solid #E2E5EB;background:#fff;color:#475569;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;text-decoration:none}
.ib:hover{background:#F4F6F9;color:#0E1525}
/* calendar */
.ovt{text-align:left;color:#0E1525;background:#fff;border:none;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px #E4E7ED}
.ovt.on{box-shadow:inset 0 0 0 2px #0E1525}
.ovr{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}
.ovr .lb{width:92px;flex-shrink:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovr .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cgrid{display:grid}
.rl{grid-row:1;grid-column:1;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0;border-right:1px solid #E4E7ED;background:#fff;position:sticky;left:0;z-index:4}
.rl b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl small{font-size:11px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.rl{border:none;border-right:1px solid #E4E7ED;text-align:left;font-family:inherit;color:#0E1525}
button.rl:hover b{text-decoration:underline}
.cdh{grid-row:1;text-align:center;padding:7px 2px;border:none;border-left:1px solid #EEF0F4;background:#fff;color:#0E1525;display:flex;flex-direction:column;align-items:center;gap:3px}
.cdh:hover{background:#F6F7F9}
.cdh.t{background:#EEF4FF}.cdh.we{background:#FAFAFB}.cdh.sel{background:#0E1525;color:#fff}
.cdh .w{font-size:11px;font-weight:600;color:#64748B}.cdh.sel .w{color:#CBD5E1}
.cdh .n{font-size:15px;font-weight:800}
.fchip{border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}
.rev{font-size:11.5px;font-weight:700;color:#334155}.cdh.sel .rev{color:#E2E8F0}
.bar{grid-row:1;z-index:2;border:none;border-radius:7px;margin:5px 1px;padding:3px 8px;text-align:left;overflow:hidden;min-width:0;display:flex;align-items:center;gap:6px;font-family:inherit}
.bar .t{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bar .t b{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t small{font-size:10.5px;font-weight:600;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop{grid-row:1;z-index:3;border-radius:8px;margin:5px 1px;font-size:12px;font-weight:800;font-family:inherit}
.pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:70;background:#0E1525;color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(14,21,37,.3);max-width:90vw}
.pickbar div{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbar button{min-height:34px;border-radius:9px;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:800;padding:0 12px}
/* tables */
.tr{display:grid;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid #F1F2F5}
.tr.th{font-size:12px;color:#64748B;font-weight:800;background:#FAFBFC;border-top:none}
.tgrp{padding:11px 16px 6px;font-size:13px;font-weight:800;border-top:1px solid #E4E7ED;background:#FCFCFD;display:flex;align-items:center;gap:8px}
.nameb{border:none;background:transparent;padding:0;text-align:left;color:#0E1525;min-width:0}
.nameb:hover .gn{text-decoration:underline}
.step{width:26px;height:26px;border-radius:7px;border:1.5px solid #CBD5E1;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:#fff;color:#64748B;padding:0}
.step.done{background:#16A34A;border-color:#16A34A;color:#fff}.step.rec{background:#0E1525;border-color:#0E1525;color:#fff}
.fbox{text-align:left;padding:11px 16px;color:#0E1525;background:#fff;border:none;border-radius:14px;box-shadow:inset 0 0 0 1px #E4E7ED}
.fbox.on{box-shadow:inset 0 0 0 2px #0E1525}
.fbox b{display:block;font-size:24px;font-weight:800}
.fbox span{font-size:13px;font-weight:700;color:#334155;display:flex;align-items:center;gap:6px}
.apf{display:flex;flex-wrap:wrap;gap:6px}
.apf button{border-radius:999px;min-height:32px;padding:0 12px;font-size:12.5px;font-weight:700;border:1px solid #E2E5EB;background:#fff;display:inline-flex;align-items:center;gap:6px}
.apf button.on{background:#0E1525;border-color:#0E1525;color:#fff}
/* revenue */
.mixbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#EEF0F4}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:#475569;margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.rcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rwd{font-size:12px;font-weight:800;color:#64748B;text-align:center;padding:2px 0}.rwd.we{color:#B45309}
.rday{border:none;border-radius:10px;padding:8px 9px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 1px #E4E7ED;color:#0E1525}
.rday.blank{background:transparent;box-shadow:none}
.rday.today{box-shadow:inset 0 0 0 2px #0E1525}.rday.sel{box-shadow:inset 0 0 0 2.5px #2563EB}
.rday .dn{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800}.rday .dn span+span{font-size:11px;font-weight:700;color:#475569}
.rday .rv{font-size:16px;font-weight:800}.rday .rv.exp{color:#1D4ED8}.rday .oc{font-size:11px;color:#475569;font-weight:600}
.ocbar{height:4px;border-radius:2px;background:rgba(14,21,37,.08);overflow:hidden;margin-top:auto}.ocbar span{display:block;height:100%;background:#EA580C}
.brk{display:flex;flex-direction:column;gap:14px}
.brk .top{display:flex;justify-content:space-between;font-size:14px}
.brk .bar2{height:9px;border-radius:999px;background:#EEF0F4;overflow:hidden;display:flex;margin:6px 0 4px}
.grow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid #F1F2F5}
/* drawer + modals */
#drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#fff;z-index:80;box-shadow:-12px 0 40px rgba(14,21,37,.16);transform:translateX(105%);transition:transform .18s ease;overflow-y:auto;padding:20px 22px 40px}
#drawer.open{transform:none}
.x{width:38px;height:38px;border-radius:10px;border:1px solid #E2E5EB;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.info{background:#F4F5F8;border-radius:12px;padding:9px 12px;border:1.5px solid transparent;text-align:left;width:100%;color:#0E1525}
button.info:hover{border-color:#CBD5E1}
button.info.on{border-color:#0E1525;background:#fff}
.info small{display:block;font-size:11.5px;color:#64748B;font-weight:600}.info small i{font-style:normal;float:right;color:#2563EB;font-weight:700}
.info b{font-size:15px;font-weight:800}
.edit{margin-top:10px;background:#fff;border:1.5px solid #0E1525;border-radius:14px;padding:4px 12px 12px}
.enote{margin-top:10px;font-size:13px;line-height:1.5;color:#334155;background:#F4F5F8;border-radius:10px;padding:8px 10px}
.fld{display:block;margin-top:10px}.fld span{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;min-height:40px;border-radius:10px;border:1.5px solid #E2E5EB;padding:0 12px;font-size:14px;font-family:inherit;background:#fff;color:#0E1525}
.fld textarea{padding:8px 12px;min-height:64px;resize:vertical}
.fld2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sect{font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#64748B;margin:16px 0 7px}
.mov{position:fixed;inset:0;z-index:90;background:rgba(14,21,37,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:20px 22px 22px;box-shadow:0 20px 60px rgba(14,21,37,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:99999;background:#0E1525;color:#fff;border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:700;box-shadow:0 10px 30px rgba(14,21,37,.3);max-width:90vw}
.tchip{min-height:40px;border-radius:10px;border:1.5px solid #E2E5EB;background:#fff;font-size:12.5px;font-weight:800}
.tchip.on,.pk.on{background:#0E1525;border-color:#0E1525;color:#fff}
.pk{border-radius:999px;min-height:32px;padding:0 12px;font-size:12.5px;font-weight:700;border:1px solid #E2E5EB;background:#fff}
.shot{width:72px;height:54px;border-radius:8px;background:#E2E5EB;object-fit:cover;cursor:zoom-in}
@media(max-width:900px){ #shell{flex-direction:column}#side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}
  .brand,.legend-s,.sdiv{display:none}.nav{width:auto;min-height:38px}#top{position:static;padding:10px 14px}#content{padding:16px 14px 50px}.search{width:100%}}
</style>
</head>
<body>
<div id="shell">
  <aside id="side"></aside>
  <div id="main">
    <header id="top"></header>
    <div id="content"><div class="empty" style="padding-top:80px">Đang tải dữ liệu…</div></div>
  </div>
</div>
<aside id="drawer" aria-label="Thẻ khách"></aside>
<div id="modal"></div>
<div id="pickbar"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{{ asset('js/journey.js') }}"></script>
<script src="{{ asset('js/photo_import.js') }}"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);

  }

  // ═════════════════════ CHI TIẾT NGÀY — one block per apartment (approved mockup, Oct 30) ═════════════════════
  // top: free rooms + "Việc cần làm" (tap = filter) · each apartment: Đến · Ở tiếp · Trả in the same frame · compact cards

  const turnIn = (b, d) => b.coO === d && b.apt && b.room_no ? B.find((x) => x.ciO === d && x.apt === b.apt && x.room_no === b.room_no && x.id !== b.id) : null;
  const dayNeeds = (b, d) => ({ confirm: b.ciO === d && d <= 0 && !b.confirmed, pay: !b.paid && b.total > 0 && b.ciO < d,

  function dayCard(b, kind) {

    const note = tin ? 'Dọn gấp → ' + tin.name + ' đến cùng phòng' : kind === 'out' && b.tb ? 'Phòng 2 ngủ — kiểm tra kỹ trước khách mới' : '';
    const todo = n.confirm || n.pay || n.clean;

    return `<div class="g2 ${S.dayTodo && !todo ? 'dim' : ''}">

        <button class="room" style="background:${a ? a.color : '#F59E0B'}" onclick="D.open('${id}')" title="Đổi căn / phòng">${esc(b.room_no ? rn(b.apt, b.room_no) : a ? 'chưa số' : 'chưa căn')}</button>
        <button class="nameb gn" style="flex:1" onclick="D.open('${id}')">${esc(b.name)}</button>
        ${b.tb ? '<span class="tb">2PN</span>' : ''}

      ${note ? `<div style="font-size:12px;font-weight:800;border-radius:8px;padding:4px 8px;${tin ? 'background:#E0F2FE;color:#075985' : 'background:#EDE9FE;color:#5B21B6'}">${esc(note)}</div>` : ''}

  function viewDay() {
    const d = S.day, f = S.dayF || 'all';

    const pass = (b) => f === 'all' || dayNeeds(b, d)[f];
    const COLS = [['in', 'Đến hôm nay', '#16A34A', ins, 'Không có khách đến'], ['stay', 'Ở tiếp qua đêm', '#2563EB', stays, 'Không có khách ở tiếp'], ['out', 'Trả phòng', '#94A3B8', outs, 'Không có khách trả']];
    const band = (a) => {

      const color = a ? a.color : '#F59E0B';
      return `<section class="card" style="overflow:hidden"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #EEF0F4;box-shadow:inset 0 3px 0 ${color}">
          <span class="dot" style="width:12px;height:12px;background:${color}"></span><b style="font-size:16px">${a ? esc(a.name) : 'Chưa xếp căn'}</b>
          ${a ? `<span style="display:flex;gap:3px">${Array.from({ length: n }, (_, k) => `<span title="${esc(rn(a.id, k + 1))}" style="width:14px;height:14px;border-radius:4px;${k < used ? 'background:' + a.color : 'background:#fff;border:1.5px dashed ' + a.color + '99'}"></span>`).join('')}</span>
            <span class="pill" style="${fr > 0 ? (fr === 1 ? 'background:#FEF3C7;color:#92400E' : 'background:#DCFCE7;color:#166534') : 'background:#FEE2E2;color:#991B1B'}">${fr > 0 ? 'Còn ' + fr + ' trống' : fr === 0 ? 'Kín phòng' : 'Thừa ' + -fr + ' khách'}</span>` : '<span class="pill" style="background:#FEF3C7;color:#92400E">chưa trừ phòng trống — bấm tên khách để xếp</span>'}
          <span style="font-size:12.5px;color:#475569;font-weight:600">${mine.filter((b) => b.ciO === d).length} đến · ${mine.filter((b) => b.ciO < d && d < b.coO).length} ở tiếp · ${mine.filter((b) => b.coO === d).length} trả</span>
          <span style="margin-left:auto;font-size:12.5px;font-weight:700;color:${unpaid ? '#991B1B' : '#166534'}">${unpaid ? 'Chưa thu ' + short(unpaid) : 'Đã thu đủ'}</span></div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:12px 16px 16px">${COLS.map(([k, title, dot, list, empty]) => {
          const l = list.filter(key).filter(pass).sort((p, q) => (p.room_no || 99) - (q.room_no || 99));
          return `<div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div class="colh2"><span class="dot" style="background:${dot}"></span>${title}<i>${list.filter(key).length}</i></div>
            ${l.map((b) => dayCard(b, k)).join('') || `<div class="muted" style="font-size:12.5px;font-weight:600;padding:8px 4px">${f === 'all' ? empty : '—'}</div>`}</div>`; }).join('')}</div></section>`;
    };
    // Báo hủy: from 3 days before today, the stays that touch this day — undo puts the guest back
    const CX = ((S.data && S.data.cancelled) || []).map((b) => ({ ...b, ciO: offOf(b.ci), coO: offOf(b.co) }))
      .filter((b) => b.ciO >= -3 && b.ciO <= d && d <= b.coO && match(b));
    const cx = CX.length ? `<section class="card" style="overflow:hidden;border-color:#FECACA"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #FEE2E2;background:#FEF2F2">
        <b style="font-size:15px;color:#991B1B">Khách đã báo hủy · ${CX.length}</b><span style="font-size:12.5px;color:#7F1D1D;font-weight:600">không tính phòng, không tính tiền · tự ẩn khi quá 3 ngày sau ngày đến · bấm Hoàn tác nếu khách vẫn đến</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:12px 16px 16px">${CX.map((b) => { const a = aptById[b.apt];
        return `<div class="g2" style="background:#FFFBFB;border-color:#FECACA"><div style="display:flex;align-items:center;gap:8px;min-width:0">
          <span class="room" style="background:${a ? a.color : '#94A3B8'};opacity:.6">${esc(b.room_no && a ? rn(b.apt, b.room_no) : a ? a.short : 'chưa căn')}</span>
          <span class="gn" style="flex:1;text-decoration:line-through;color:#7F1D1D">${esc(b.name)}</span><span class="pill" style="background:#FEE2E2;color:#991B1B">Báo hủy</span></div>
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#475569;font-weight:600"><span class="num">${dm(b.ciO)} → ${dm(b.coO)} · ${b.nights} đêm · ${esc(b.listing || '')}</span><span class="num" style="font-weight:800">${fmt(b.total)}</span></div>
          <div style="display:flex;align-items:center;gap:6px"><span style="flex:1;font-size:12px;color:#64748B;font-weight:600">Ẩn sau ${dm(b.ciO + 3)}${b.phone ? ' · ' + esc(b.phone) : ''}</span>
            <button class="act2" style="flex:0 0 auto;background:#fff;color:#0E1525;border:1px solid #E2E5EB" onclick="D.uncancel('${esc(b.id)}')">Hoàn tác — khách vẫn đến</button></div></div>`; }).join('')}</div></section>` : '';
    return `<div class="stack" style="gap:16px">
      <div style="display:flex;justify-content:flex-end"><div class="seg"><button class="${!S.dayTodo ? 'on' : ''}" onclick="D.set('dayTodo',false)">Tất cả khách</button><button class="${S.dayTodo ? 'on' : ''}" onclick="D.set('dayTodo',true)">Chỉ khách cần làm</button></div></div>
      <section class="card" style="padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:stretch">
        <div style="display:flex;align-items:center;gap:12px;padding-right:16px;border-right:1px solid #EEF0F4">
          <div class="num" style="font-size:44px;font-weight:800;line-height:1;color:${fcol(free)}">${Math.max(0, free)}</div>
          <div><div style="font-size:14px;font-weight:800">phòng trống đêm ${d === 0 ? 'nay' : dm(d)}</div><div style="font-size:12.5px;color:#475569;font-weight:600">trên ${CAP()} phòng · ${tonight} có khách</div></div></div>
        <div style="flex:1;min-width:0"><div style="font-size:11.5px;font-weight:800;letter-spacing:.6px;color:#64748B;margin-bottom:6px">VIỆC CẦN LÀM ${d === 0 ? 'HÔM NAY' : 'NGÀY ' + dm(d)} · bấm để lọc</div>
          <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px">${todos}</div></div></section>
      ${APT.map(band).join('')}${band(null)}${cx}
      <div style="font-size:12.5px;color:#475569;line-height:1.6"><b>Cách đọc:</b> ô màu đầu thẻ = <b>phòng</b> (màu của căn, bấm để đổi) · nhãn bên phải = <b>tiền</b> · chấm = <b>liên lạc</b> (bấm khi đã nhắn ngoài app / khách trả lời) · nút đen = <b>việc nên làm ngay</b> · nút nhỏ: nhắn · gọi · nhắc · thẻ khách (gia hạn, sửa giá, đổi căn, ảnh, báo hủy).</div></div>`;

  D.uncancel = async (id) => {

  // ═════════════════════ LỊCH PHÒNG ═════════════════════
  function viewCal() {
    const N = S.calN, ws = S.calStart, we = ws + N, ca = S.ca;
    needRev(ws, we);
    const days = []; for (let o = ws; o < we; o++) days.push(o);
    const colW = N === 7 ? 150 : 78;
    const tpl = `display:grid;grid-template-columns:200px repeat(${N * 2},minmax(${colW / 2}px,1fr))`;
    const dcol = (i) => `grid-row:1;grid-column:${2 + 2 * i} / span 2;`;
    const dbg = (o) => o === 0 ? 'background:#EEF4FF;' : weekend(o) ? 'background:#FAFAFB;' : '';
    const pk = S.pick && byId[S.pick];
    const showA = APT.filter((a) => !ca || a.id === ca);
    const span = (b) => { const h0 = Math.max(2 * b.ciO + 1, 2 * ws), h1 = Math.min(2 * b.coO + 1, 2 * we); return h1 > h0 ? [h0, h1] : null; };
    const at = (sp) => `grid-row:1;grid-column:${sp[0] - 2 * ws + 2} / span ${sp[1] - sp[0]};`;
    const cells = () => days.map((o, i) => `<div style="${dcol(i)}border-left:1px solid #EEF0F4;${dbg(o)}"></div>`).join('');
    const bar = (b) => { const sp = span(b); if (!sp) return '';
      const col = aptColor(b), st = stOf(b);
      let s = at(sp);
      if (b.coO < 0) s += 'background:#E5E7EB;color:#475569;';
      else if (b.ciO <= 0 && b.confirmed) s += `background:${col};color:#fff;`;
      else if (b.ciO <= 0) s += 'background:#FFFBEB;color:#92400E;box-shadow:inset 0 0 0 1.5px #F59E0B;';
      else s += `background:${col}1F;color:#0E1525;box-shadow:inset 0 0 0 1px ${col}70;`;
      if (S.pick === b.id || S.sel === b.id) s += 'outline:2.5px solid #F59E0B;outline-offset:1px;';
      const tip = esc(b.name + ' · ' + dm(b.ciO) + ' → ' + dm(b.coO) + ' · ' + b.nights + ' đêm · ' + fmt(b.per_night) + '/đêm · ' + b.listing + ' · ' + st.t + ' · ' + payTxt(b) + ' — bấm để xếp phòng, bấm đúp để mở thẻ');
      const narrow = (sp[1] - sp[0]) * (N === 7 ? 75 : 39) < 120;      // under ~120 px: name only, smaller, no dot / 2PN chip
      return `<button class="bar" style="${s}${narrow ? 'padding:3px 5px;' : ''}" onclick="D.pickG('${esc(b.id)}')" ondblclick="D.open('${esc(b.id)}')" title="${tip}">
        ${narrow ? `<span class="t"><b style="font-size:11px">${esc(b.name)}</b><small>${b.nights}đ${b.tb ? ' · 2PN' : ''}</small></span>`
          : `<span class="dot" style="background:${st.c};box-shadow:0 0 0 2px #fff"></span><span class="t"><b>${esc(b.name)}</b><small>${b.nights} đêm · ${short(b.per_night)} · ${b.paid ? 'đã thu' : 'chưa thu'}</small></span>${b.tb ? '<span class="tb">2PN</span>' : ''}`}</button>`; };
    const lanes = (list) => { const L = []; list.slice().sort((p, q) => p.ciO - q.ciO).forEach((b) => { const l = L.find((x) => x.end <= b.ciO); if (l) { l.bs.push(b); l.end = b.coO; } else L.push({ end: b.coO, bs: [b] }); }); return L; };
    const vis = (b) => b.coO > ws && b.ciO < we && match(b);   // left before the first night shown = not drawn
    const rowSt = tpl + ';min-height:50px;border-top:1px solid #EEF0F4;';
    let rows = '';
    showA.forEach((a) => {
      rows += `<div style="${tpl};min-height:34px;border-top:1px solid #E4E7ED;background:#F8FAFC"><div class="rl" style="background:#F8FAFC;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px"><span class="dot" style="background:${a.color}"></span><b>${esc(a.name)} · ${a.rooms} phòng</b></div>
        ${days.map((o, i) => { const f = a.rooms - usedIn(a.id, o); return `<div style="${dcol(i)}display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;border-left:1px solid #EEF0F4;color:${f <= 0 ? (f < 0 ? '#B91C1C' : '#475569') : f === 1 ? '#B45309' : '#15803D'}">${f > 0 ? 'Trống ' + f : f === 0 ? 'Kín' : 'Thừa ' + -f}</div>`; }).join('')}</div>`;
      for (let no = 1; no <= a.rooms; no++) {

        if (pk && !(pk.apt === a.id && pk.room_no === no)) { const sp0 = span(pk), lo = 2 * Math.max(0, ws) ;
          const sp = sp0 && [Math.max(sp0[0], 2 * Math.max(pk.ciO, 0) + 1), sp0[1]];

      }
      lanes(B.filter((b) => b.apt === a.id && !b.room_no && vis(b))).forEach((l) => {
        rows += `<div style="${rowSt}background:#FFFDF5"><div class="rl" style="background:#FFFDF5"><b style="color:#92400E">Chưa có số phòng</b><small>bấm khách → chọn ô xanh</small></div>${cells()}${l.bs.map(bar).join('')}</div>`; });
    });
    if (!ca) { const L = lanes(B.filter((b) => !b.apt && vis(b)));
      if (L.length) rows += `<div style="${tpl};min-height:32px;border-top:1px solid #E4E7ED;background:#FFFBEB"><div class="rl" style="background:#FFFBEB"><b style="color:#92400E">Chưa xếp căn</b></div></div>`
        + L.map((l) => `<div style="${rowSt}"><div class="rl"><b>Chưa xếp căn</b><small>bấm đúp → thẻ khách → chọn căn</small></div>${cells()}${l.bs.map(bar).join('')}</div>`).join(''); }
    const head = days.map((o, i) => { const f = ca ? roomsOf(ca) - usedIn(ca, o) : freeOn(o), r = revDay(o);
      const tbN = B.filter((b) => b.tb && b.coO === o && (!ca || b.apt === ca)).length;
      const rv = r ? (r.is_future ? r.expected : r.revenue) : null;
      return `<button class="cdh ${S.dsel === o ? 'sel' : o === 0 ? 't' : weekend(o) ? 'we' : ''}" style="${dcol(i)}" onclick="D.openDay(${o})" aria-label="Chi tiết ngày ${dm(o)}">
        <span class="w">${o === 0 ? 'Hôm nay' : wd(o)}</span><span class="n num">${dm(o)}</span><span class="fchip" style="${fbg(f)}">${f > 0 ? f + ' trống' : f === 0 ? 'Kín' : 'Thừa ' + -f}</span>
        ${!ca ? `<span class="rev num" title="${r ? (r.is_future ? 'Dự kiến (chưa tính) ' : 'Doanh thu ') + fmt(rv) + (r.pending_value ? ' · +' + fmt(r.pending_value) + ' khách chờ xác nhận' : '') : 'đang tải…'}" style="${r && r.is_future ? 'color:#1D4ED8' : ''}">${r ? short(rv) : '…'}</span>` : ''}
        ${tbN ? `<span class="fchip" style="background:#6D28D9;color:#fff">${tbN} 2PN trả</span>` : ''}</button>`; }).join('');
    // overview tiles for one night (today or the clicked day)
    const od = S.dsel !== null ? S.dsel : 0;
    const tiles = APT.map((a) => {
      const f = a.rooms - usedIn(a.id, od), on = ca === a.id;
      const lines = Array.from({ length: a.rooms }, (_, k) => { const no = k + 1, b = B.find((x) => x.apt === a.id && x.room_no === no && inHouse(x, od)), ok = b && counts(b, od);
        return `<div class="ovr"><span style="width:12px;height:12px;border-radius:3px;flex-shrink:0;${!b ? 'border:1.5px dashed ' + a.color + '99' : ok ? 'background:' + a.color : 'background:#FDE68A;border:1.5px solid #F59E0B'}"></span>
          <span class="lb">${esc(rn(a.id, no))}</span><span class="tx" style="color:${!b ? '#15803D' : ok ? '#0E1525' : '#92400E'}">${!b ? 'Trống' : (ok ? '' : 'Chờ xác nhận: ') + esc(b.name) + (b.ciO === od ? ' · đến' : '') + (b.coO === od + 1 ? ' · trả ' + dm(b.coO) : '')}</span></div>`; }).join('');
      const extra = B.filter((x) => x.apt === a.id && !x.room_no && inHouse(x, od));
      const strip = days.map((o) => { const x = a.rooms - usedIn(a.id, o);
        return `<span title="${wd(o)} ${dm(o)}: ${x > 0 ? 'trống ' + x : x === 0 ? 'kín' : 'thừa ' + -x}" style="height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;${fbg(x <= 0 ? 0 : x === 1 ? 1 : 3)}${o === od ? ';box-shadow:0 0 0 2px #0E1525' : ''}">${x < 0 ? '!' : x}</span>`; }).join('');
      return `<button class="ovt ${on ? 'on' : ''}" onclick="D.set('ca',${on ? "''" : a.id})" aria-label="${on ? 'Bỏ lọc ' : 'Chỉ xem '}${esc(a.name)}">
        <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800"><span class="dot" style="width:11px;height:11px;background:${a.color}"></span>${esc(a.name)}<span style="margin-left:auto;font-size:11px;font-weight:700;color:#64748B">${on ? 'đang lọc · bấm để bỏ' : a.rooms + ' phòng'}</span></div>
        <div style="display:flex;align-items:baseline;gap:8px;margin-top:6px"><span class="num" style="font-size:36px;font-weight:800;line-height:1;color:${fcol(f === 1 ? 1 : f <= 0 ? 0 : 3)}">${Math.max(0, f)}</span><span style="font-size:13px;font-weight:600;color:#475569">${f > 0 ? 'phòng trống / ' + a.rooms : f === 0 ? 'hết phòng' : 'thừa ' + -f + ' khách'}</span></div>
        <div style="display:flex;flex-direction:column;gap:5px;margin-top:10px">${lines}${extra.length ? `<div class="ovr"><span style="width:12px;height:12px;border-radius:3px;background:#FDE68A;flex-shrink:0"></span><span class="lb">Chưa có số</span><span class="tx" style="color:#92400E">${extra.map((x) => esc(x.name)).join(', ')}</span></div>` : ''}</div>
        <div style="font-size:12px;font-weight:700;color:#334155;margin-top:10px;padding-top:8px;border-top:1px solid #EEF0F4">${B.filter((x) => x.apt === a.id && x.ciO < od && od < x.coO).length} đang ở · ${B.filter((x) => x.apt === a.id && x.ciO === od).length} đến · ${B.filter((x) => x.apt === a.id && x.coO === od).length} trả</div>
        <div style="display:grid;grid-template-columns:repeat(${N},minmax(0,1fr));gap:2px;margin-top:8px">${strip}</div>
        <div style="font-size:11px;color:#64748B;margin-top:4px">Phòng trống từng đêm ${dm(ws)} → ${dm(we - 1)}</div></button>`;
    }).join('');
    // window KPIs — revenue / occupancy straight from the dashboard's per-day numbers
    const rd = days.map(revDay), have = rd.every(Boolean);
    const revSum = rd.reduce((t, r) => t + (r ? (r.is_future ? r.expected : r.revenue) : 0), 0), pend = rd.reduce((t, r) => t + (r ? r.pending_value || 0 : 0), 0);
    const sold = rd.reduce((t, r) => t + (r ? r.rooms : 0), 0), capS = rd.reduce((t, r) => t + (r ? r.capacity : 0), 0);
    const fut = days.filter((o) => o >= 0); const quiet = fut.length ? fut.reduce((bst, o) => freeOn(o) > freeOn(bst) ? o : bst, fut[0]) : null;
    const insW = B.filter((b) => b.ciO >= ws && b.ciO < we).length, outsW = B.filter((b) => b.coO >= ws && b.coO < we).length, tbW = B.filter((b) => b.tb && b.coO >= ws && b.coO < we).length;
    const noNum = B.filter((b) => b.apt && !b.room_no && b.coO > Math.max(ws, 0) && b.ciO < we).length;
    return `<div class="stack">
      <section style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px"><h3 style="margin:0;font-size:15px">Tổng quan căn hộ · ${od === 0 ? 'đêm nay' : 'đêm'} ${wd(od)} ${dm(od)}</h3>
        <span class="muted" style="font-size:13px">bấm một căn để chỉ xem căn đó · bấm ngày trên lịch để xem đêm khác</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px">${tiles}</div></section>
      <div class="kpis">
        <div class="card kpi"><div class="l">Doanh thu ${dm(ws)} → ${dm(we - 1)}</div><div class="v num">${have ? short(revSum) : '…'}</div><div class="s">${pend ? '+ ' + short(pend) + ' của khách chờ xác nhận' : 'quá khứ = đã có · tới = dự kiến'}</div></div>
        <div class="card kpi"><div class="l">Công suất phòng</div><div class="v num">${have && capS ? Math.round(sold * 100 / capS) + '%' : '…'}</div><div class="s">${sold} / ${capS} đêm phòng có khách</div></div>
        <div class="card kpi"><div class="l">Khách đến · trả</div><div class="v num">${insW} · ${outsW}</div><div class="s">${tbW ? '<b style="color:#6D28D9">' + tbW + ' lần trả phòng 2 ngủ</b>' : 'không có phòng 2 ngủ trả'}</div></div>

            ${noNum ? `<button class="btn sm" style="border-style:dashed" onclick="D.auto()">Tự xếp phòng cho ${noNum} khách đã có căn</button>` : ''}</div>
          <div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#475569;font-weight:600">
            <span style="display:flex;align-items:center;gap:6px"><i style="width:18px;height:10px;border-radius:3px;background:#2F62D6"></i>Đã đến / đang ở</span>
            <span style="display:flex;align-items:center;gap:6px"><i style="width:18px;height:10px;border-radius:3px;background:#2F62D61F;box-shadow:inset 0 0 0 1px #2F62D670"></i>Sắp đến</span>

            <span style="display:flex;align-items:center;gap:6px"><i style="width:18px;height:10px;border-radius:3px;background:#E5E7EB"></i>Đã trả</span></div></div>
        <div style="padding:8px 18px;font-size:12.5px;color:#475569;border-bottom:1px solid #EEF0F4">Thanh khách bắt đầu <b>giữa ngày đến</b>, hết <b>giữa ngày trả</b> — khách trả và khách đến cùng phòng một ngày thấy nối nhau. Doanh thu dưới ngày: <b>đen</b> = đã có, <b style="color:#1D4ED8">xanh</b> = dự kiến (cùng số với trang Doanh thu). Bấm tên phòng để đổi tên.</div>
        <div style="overflow-x:auto"><div style="min-width:${200 + N * colW}px">
          <div style="${tpl};position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #E4E7ED"><div class="rl" style="background:#FAFBFC"><b>Ngày · phòng trống</b><small>bấm ngày → chi tiết ngày</small></div>${head}</div>

  function renderPick() {

  // ═════════════════════ NHẮN KHÁCH ═════════════════════
  function viewMsg() {
    const arr = B.filter((b) => b.ciO >= 0 && b.ciO < S.mrange), stay = B.filter((b) => b.ciO < 0 && b.coO >= 0);

    const key = (b) => (b.apt ? String(b.apt) : 'none');
    const scope = scope0.filter((b) => !S.mapt || key(b) === String(S.mapt));
    const done = (b) => stOf(b).k !== 'todo';

    const cols = 'grid-template-columns:minmax(180px,1.4fr) minmax(110px,1fr) minmax(130px,1fr) 170px 200px minmax(150px,1fr) 80px';
    const row = (b) => { const st = stOf(b);
      const steps = S.data.steps.map((s, i) => `<button class="step ${b.sent.includes(s.key) ? 'done' : s.key === b.next ? 'rec' : ''}" onclick="D.send('${esc(b.id)}','${s.key}')" title="${i + 1}. ${esc(s.label)}${b.sent.includes(s.key) ? ' — đã gửi' : s.key === b.next ? ' — nên gửi bây giờ' : ''}">${i + 1}</button>`).join('');
      return `<div class="tr" style="${cols};${b.unreach ? 'opacity:.6' : ''}">

          <span class="gs" style="display:block">${b.vn ? 'Tiếng Việt' : 'English'} · ${b.phone ? esc(b.phone) : b.partner ? 'đối tác — nhắn qua Booking' : '<span style="color:#B45309">chưa có số</span>'}</span></button>
        <button class="nameb" onclick="D.pickApt('${esc(b.id)}')" title="Chọn / đổi căn" style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700"><span class="dot" style="background:${aptColor(b)}"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${b.apt ? '' : 'color:#B45309'}">${esc(where(b))}</span></button>
        <div style="font-size:13px"><div class="num" style="font-weight:700">${dm(b.ciO)} → ${dm(b.coO)} · ${b.nights} đêm</div><div class="gs">${short(b.per_night)}/đêm · ${fmt(b.total)}</div></div>
        <div><button class="pill" style="background:${st.bg};color:${st.fg};cursor:pointer" onclick="D.status('${esc(b.id)}')" title="${st.k === 'todo' ? 'Bấm nếu đã nhắn ngoài app' : st.k === 'wait' ? 'Bấm khi khách trả lời' : esc(st.s)}">${esc(st.t)}</button>
          <div class="gs" style="font-size:11px">${esc(st.s)}</div></div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">${steps}</div>
        <div>${b.next ? `<button class="btn sm pri" onclick="D.send('${esc(b.id)}','${b.next}')">Gửi: ${esc(stepLabel(b.next))}</button>` : '<span class="muted" style="font-size:12.5px">Đã gửi đủ</span>'}

    else for (let d = 0; d < S.mrange; d++) { const l = shown.filter((b) => b.ciO === d).sort((p, q) => (p.apt || 999) - (q.apt || 999) || q.total - p.total);
      if (l.length) body += `<div class="tgrp">${rel(d)} · ${wdf(d)} ${dm(d)}<span class="muted" style="font-weight:600">· ${l.length} khách đến · ${l.filter((b) => !b.unreach && !done(b)).length} chưa nhắn</span></div>` + l.map(row).join(''); }
    const steps = S.data.steps.map((s, i) => (i + 1) + ' ' + s.label.split(' &')[0]).join(' · ');
    return `<div class="stack">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <div class="seg"><button class="${S.mtab === 'arr' ? 'on' : ''}" onclick="D.set('mtab','arr')">Sắp đến · ${arr.length}</button><button class="${S.mtab === 'stay' ? 'on' : ''}" onclick="D.set('mtab','stay')">Đang ở · ${stay.length}</button></div>
        ${S.mtab === 'arr' ? `<div class="seg">${[[1, 'Hôm nay'], [2, 'Đến mai'], [3, '3 ngày'], [7, '7 ngày']].map(([k, l]) => `<button class="${S.mrange === k ? 'on' : ''}" onclick="D.set('mrange',${k})">${l}</button>`).join('')}</div>` : ''}
        <div class="apf"><button class="${!S.mapt ? 'on' : ''}" onclick="D.set('mapt',null)">Tất cả căn</button>${APT.map((a) => `<button class="${String(S.mapt) === String(a.id) ? 'on' : ''}" onclick="D.set('mapt','${a.id}')"><span class="dot" style="background:${a.color}"></span>${esc(a.short)}</button>`).join('')}<button class="${S.mapt === 'none' ? 'on' : ''}" onclick="D.set('mapt','none')">Chưa xếp căn</button></div>

      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">${[['all', 'Tất cả', n.all, '#0E1525'], ['todo', 'Chưa nhắn', n.todo, '#DC2626'], ['done', 'Đã nhắn', n.done, '#F59E0B'], ['unreach', 'Không liên lạc được', n.unreach, '#94A3B8']]

        <div style="overflow-x:auto"><div style="min-width:1100px"><div class="tr th" style="${cols}"><div>Khách</div><div>Căn · phòng</div><div>Ngày ở</div><div>Liên lạc</div><div>Các bước</div><div>Gửi tiếp</div><div></div></div>
        ${body || `<div class="empty">${S.mf === 'todo' ? 'Đã nhắn hết cho khách trong mục này.' : 'Không có khách nào ở đây.'}</div>`}</div></div></section></div>`;
  }

  // ═════════════════════ THU TIỀN ═════════════════════
  function viewPay() {
    const items = B.filter((b) => b.ciO <= 0 && b.coO >= -10 && !b.skipped && b.total > 0 && match(b));

      const b = byId[S.mfor], l = left(b), id = esc(b.id);
      el.innerHTML = wrap(head('THU TIỀN', esc(b.name)) + `<div class="num" style="font-size:30px;font-weight:800;margin-top:10px">${fmt(l)}</div>
        <div class="num muted" style="font-size:12.5px;font-weight:600">${esc(where(b))} · ${dm(b.ciO)} → ${dm(b.coO)} · ${b.nights} đêm${b.collected ? ' · đã thu ' + fmt(b.collected) : ''}</div>
        <div class="seg" style="margin-top:14px"><button class="${S.cmethod === 'cash' ? 'on' : ''}" onclick="D.mset('cmethod','cash')">Tiền mặt</button><button class="${S.cmethod === 'bank' ? 'on' : ''}" onclick="D.mset('cmethod','bank')">Chuyển khoản</button></div>
        <div class="sect">Ai đã thu? — bấm là lưu</div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${S.data.collectors.map((p) => `<button onclick="D.collect('${id}','${p}')" style="min-height:70px;border-radius:14px;border:none;background:#0E1525;color:#fff"><div style="font-size:18px;font-weight:800">${esc(p)}</div><div class="num" style="font-size:11.5px;font-weight:600;color:#A7B0C0">thu ${fmt(l)}</div></button>`).join('')}</div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px">${S.data.collectors.map((p) => `<button class="btn sm" onclick="D.partial('${id}','${p}')">${esc(p)} thu số khác…</button>`).join('')}</div>`);
      return;
    }
    if (S.modal === 'remind' && byId[S.mfor]) {
      const b = byId[S.mfor], mine = REM().filter((r) => r.booking_id === b.id);
      const NOTES = ['Phản hồi khách', 'Gọi lại khách', 'Nhắc khách thanh toán', 'Gửi mã cửa / hướng dẫn', 'Đón khách', 'Hỏi giờ đến'];
      const PRE = [[15, '15 phút nữa'], [30, '30 phút nữa'], [60, '1 tiếng nữa'], [120, '2 tiếng nữa'], [-1, 'Tối nay 19:00'], [-2, 'Tối nay 21:00'], [-3, 'Sáng mai 8:00'], [-4, 'Trưa mai 12:00']];
      const note = (S.remNote || '').trim() || 'Phản hồi khách';
      el.innerHTML = wrap(head('NHẮC VIỆC · ' + esc(where(b)) + ' · ' + dm(b.ciO) + ' → ' + dm(b.coO), esc(b.name))
        + (mine.length ? `<div class="sect">Đã đặt</div>${mine.map((r) => `<div class="remrow" style="background:#F7F8FA;margin-top:4px;${r.done ? 'opacity:.55' : ''}"><b class="num" style="width:70px;color:${overdue(r) ? '#B91C1C' : '#92400E'}">${remLabel(r.at)}</b><span style="flex:1;font-size:13px;font-weight:700">${esc(r.note)}</span>
          ${r.done ? '' : `<button class="btn xs ok" onclick="D.remDone(${r.id})">Xong</button>`}<button class="btn xs" onclick="D.remDone(${r.id},true)" aria-label="Xoá">${ico('x', 12, 2.4)}</button></div>`).join('')}` : '')
        + `<div class="sect">Nhắc việc gì</div><div style="display:flex;flex-wrap:wrap;gap:6px">${NOTES.map((x) => `<button class="pk ${S.remNote === x ? 'on' : ''}" onclick="D.remSet('remNote','${x}',true)">${x}</button>`).join('')}</div>
        <label class="fld"><span>Ghi chú thêm</span><textarea oninput="D.remSet('remNote',this.value)" placeholder="vd: khách hỏi chỗ gửi xe máy">${esc(NOTES.includes(S.remNote) ? '' : S.remNote)}</textarea></label>
        <div class="sect">Nhắc lúc</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">${PRE.map(([k, l]) => `<button class="tchip" onclick="D.remPreset(${k})">${l}</button>`).join('')}</div>
        <label class="fld"><span>Giờ khác</span><input type="datetime-local" value="${esc(S.remAt)}" onchange="D.remSet('remAt',this.value,true)"></label>
        ${S.remAt ? `<button class="btn pri" style="width:100%;margin-top:12px;min-height:44px" onclick="D.remSave()">Lưu nhắc ${remLabel(S.remAt)} · ${esc(note)}</button>` : '<div class="muted" style="font-size:12.5px;margin-top:10px">Chọn giờ nhắc ở trên.</div>'}
        <div class="muted" style="font-size:12px;margin-top:10px;line-height:1.5">Lời nhắc hiện ở trang Hôm nay và trong Lịch iPhone (nếu đã kết nối Lịch ở bản điện thoại) với đủ tên, số, căn/phòng, ngày ở.</div>`);
      return;
    }
    if (S.modal === 'ext') {
      el.innerHTML = wrap(head('TIỆN ÍCH CHROME', 'Gửi về Hotel Pro' + (S.extVer ? ' · bản ' + esc(S.extVer) : '')) + `
        <div class="muted" style="font-size:13px;margin-top:6px;line-height:1.55">Tiện ích chỉ <b>đọc trang Booking bạn đang mở</b> rồi gửi về web — không tự đăng nhập, không tự bấm gì trên Booking.</div>
        <a class="btn pri" style="width:100%;margin-top:14px;min-height:48px" href="/extension.zip" download>⬇ Tải tiện ích (.zip)</a>
        <div class="sect">Cài trên máy tính mới (1 lần)</div>
        <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.7;color:#334155">
          <li>Bấm <b>Tải tiện ích</b> ở trên, rồi <b>giải nén</b> file .zip (chuột phải → Extract All / Giải nén) — được thư mục <b>chrome_extension</b>.</li>
          <li>Mở Chrome, gõ <b>chrome://extensions</b> (Edge: <b>edge://extensions</b>).</li>
          <li>Bật <b>Developer mode / Chế độ nhà phát triển</b> (góc phải trên).</li>
          <li>Bấm <b>Load unpacked / Tải tiện ích đã giải nén</b> → chọn thư mục <b>chrome_extension</b>.</li>
          <li>Ghim tiện ích (biểu tượng mảnh ghép 🧩 → 📌), bấm vào → <b>Kiểm tra kết nối</b> → <b>Lưu</b>.</li></ol>
        <div class="sect">Cập nhật bản mới</div>
        <div style="font-size:13.5px;line-height:1.6;color:#334155">Tải lại file .zip, giải nén <b>đè lên thư mục cũ</b>, rồi ở chrome://extensions bấm nút <b>↻ tải lại</b> trên thẻ tiện ích.</div>`);
      return;
    }
    if (S.modal === 'add') {
      const listings = [...new Set(B.map((b) => b.listing).filter(Boolean))].sort();
      el.innerHTML = wrap(head('THÊM ĐẶT PHÒNG', 'Khách mới') + `
        <label class="fld"><span>Tên khách</span><input id="fName" placeholder="vd: John Smith"></label>
        <div class="fld2"><label class="fld"><span>Ngày đến</span><input id="fCi" type="date" value="${TODAY}"></label><label class="fld"><span>Ngày đi</span><input id="fCo" type="date" value="${isoOf(1)}"></label></div>
        <label class="fld"><span>Loại phòng</span><input id="fListing" list="fLists" placeholder="chọn hoặc gõ"><datalist id="fLists">${listings.map((l) => `<option value="${esc(l)}">`).join('')}</datalist></label>
        <div class="fld2"><label class="fld"><span>Tổng tiền (đ) — vd 1500000, 1,5tr</span><input id="fAmt" inputmode="decimal"></label><label class="fld"><span>Số điện thoại</span><input id="fPhone" type="tel" placeholder="+84…"></label></div>
        <div class="fld2"><label class="fld"><span>Căn hộ</span><select id="fApt"><option value="">Chưa xếp</option>${APT.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></label>
          <label class="fld"><span>Mã đặt phòng (nếu có)</span><input id="fBid" inputmode="numeric" placeholder="để trống = mã tạm"></label></div>
        <button class="btn pri" style="width:100%;margin-top:16px;min-height:46px" onclick="D.addSave(this)">Lưu khách</button>
        <button class="btn" style="width:100%;margin-top:10px;border-style:dashed" onclick="D.photo()">📷 Hoặc thêm từ ảnh chụp app Booking</button>`);
      return;
    }
    el.innerHTML = '';
  }
  D.mset = (k, v) => { S[k] = v; renderModal(); };
  D.extOpen = () => { S.modal = 'ext'; renderModal(); fetch('/api/extension/info').then((r) => r.json()).then((j) => { if (j.success) { S.extVer = j.version; if (S.modal === 'ext') renderModal(); } }).catch(() => {}); };

  // reminders that come due while the page is open
  const alerted = new Set();
  setInterval(() => { REM().forEach((r) => { if (r.id && overdue(r) && !alerted.has(r.id)) { alerted.add(r.id); const b = byId[r.booking_id];
    toast('🔔 ' + r.note + (b ? ' — ' + b.name : '')); renderSide(); } }); }, 30000);

  if (!['today', 'day', 'cal', 'msg', 'pay', 'rev'].includes(S.tab)) S.tab = 'today';
  load();
})();
</script>
</body>
</html>
