<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F3D3E">
<title>{% if data %}{{ data.name }} · Guest Guide{% else %}Guest Guide · Hanoi Old Quarter{% endif %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14201F;--sub:#5B6766;--mute:#8C9695;--line:#E7E3DA;--bg:#F7F4EE;--card:#fff;--deep:#0F3D3E;--deep2:#17595A;
  --gold:#E9B44C;--red:#C2410C;--redbg:#FFF1EB;--grn:#15803D;--grnbg:#ECF8F0;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}
.screen{animation:in .32s cubic-bezier(.2,.8,.2,1) both;padding-bottom:96px}
.screen.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
/* hero */
.hero{position:relative;color:#fff;padding:22px 20px 30px;border-radius:0 0 32px 32px;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,#2C7A6E 0%,transparent 55%),linear-gradient(160deg,var(--deep) 0%,#0B2C2D 100%)}
.hero:after{content:"";position:absolute;inset:0;opacity:.09;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 14px)}
.hero .brand{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero .brand i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--gold);color:var(--deep);display:grid;place-items:center;font-size:14px}
.hero h1{font-size:30px;line-height:1.12;margin:18px 0 6px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1}
.hero p{margin:0;opacity:.85;font-size:15px;position:relative;z-index:1}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}
.hero .chips span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);
  padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600}
.hero .lantern{position:absolute;right:16px;top:44px;font-size:64px;opacity:.95;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));
  animation:sway 4s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.pad{padding:0 16px}
.h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:24px 4px 12px}
/* apartment chooser */
.apt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;text-decoration:none;box-shadow:0 1px 0 rgba(0,0,0,.02),0 8px 24px -16px rgba(15,61,62,.35);
  animation:pop .4s both;transition:transform .15s}
.apt:active,.tile:active{transform:scale(.97)}
.apt .num{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.apt b{display:block;font-size:18px}.apt small{color:var(--sub);font-size:13px}
.apt .go{margin-left:auto;font-size:22px;color:var(--mute)}
.apt.last{border-color:var(--deep);box-shadow:0 0 0 2px var(--deep)}
/* topic tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-18px;position:relative;z-index:2}
.tile{border:0;text-align:left;border-radius:var(--r);padding:16px 14px 14px;min-height:138px;display:flex;flex-direction:column;
  background:var(--card);box-shadow:0 10px 28px -18px rgba(15,61,62,.45),0 1px 0 rgba(0,0,0,.03);animation:pop .45s both;
  transition:transform .15s;position:relative;overflow:hidden}
.tile .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:26px;margin-bottom:auto}
.tile b{font-size:16px;margin-top:12px;line-height:1.25}
.tile span{font-size:12.5px;color:var(--sub);line-height:1.35;margin-top:2px}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile.wide .ic{margin:0}.tile.wide b{margin:0}
.tile .arrow{position:absolute;right:14px;top:16px;color:var(--mute);font-size:18px}
/* topic screen */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(247,244,238,.88);backdrop-filter:blur(10px)}
.bar button{border:0;background:var(--card);border-radius:999px;padding:8px 14px 8px 10px;font-weight:700;font-size:14px;box-shadow:0 2px 10px -6px rgba(0,0,0,.3)}
.bar .t{font-weight:700;font-size:14px;color:var(--sub);margin-left:auto;padding-right:6px}
.thero{margin:6px 16px 0;border-radius:26px;padding:22px 20px;color:#fff;position:relative;overflow:hidden}
.thero .big{font-size:46px;line-height:1}
.thero h1{margin:10px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.thero p{margin:0;opacity:.9;font-size:15px}
.thero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.12)}
/* step carousel */
.prog{display:flex;gap:6px;margin:18px 20px 10px}
.prog i{flex:1;height:5px;border-radius:9px;background:#E2DDD2;overflow:hidden;position:relative}
.prog i.on:after{content:"";position:absolute;inset:0;background:var(--c);animation:grow .35s both}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:none}}
.card{margin:0 16px;background:var(--card);border-radius:26px;box-shadow:0 14px 34px -22px rgba(15,61,62,.5);overflow:hidden;touch-action:pan-y}
.stage{height:190px;display:grid;place-items:center;background:linear-gradient(180deg,var(--cbg),#fff)}
.stage>*{animation:pop .4s both}
.card .body{padding:18px 20px 20px}
.card .k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.card .txt{font-size:19px;font-weight:600;line-height:1.4;margin-top:6px}
.nav{display:flex;gap:10px;margin:14px 16px 0}
.nav button{flex:1;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:16px}
.nav .prev{background:var(--card);color:var(--sub);flex:0 0 34%}
.nav .next{background:var(--c);color:#fff;box-shadow:0 10px 20px -12px var(--c)}
.note{margin:14px 16px 0;border-radius:18px;padding:14px 16px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.note.tip{background:var(--grnbg);color:var(--grn)}.note.warn{background:var(--redbg);color:var(--red)}
.help{margin:14px 16px 0;background:var(--card);border-radius:18px;padding:14px 16px;font-size:15px}
.help button{margin-top:10px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;width:100%}
.help .ans{margin-top:10px;color:var(--sub)}
.all{display:block;margin:16px auto 0;border:0;background:none;color:var(--sub);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.list{margin:12px 16px 0;background:var(--card);border-radius:22px;padding:4px 16px}
.list .row{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
/* pictures */
.rm{width:64px;background:linear-gradient(180deg,#3a3a3a,#1f1f1f);border-radius:18px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 12px 24px -10px rgba(0,0,0,.5)}
.rm u{text-decoration:none;width:38px;height:26px;border-radius:8px;background:#4a4a4a;color:#cfcfcf;font-size:13px;display:grid;place-items:center}
.rm u.hi{background:#fff;color:#111;box-shadow:0 0 0 3px #22c55e;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px #22c55e}50%{box-shadow:0 0 0 7px rgba(34,197,94,.25)}}
.two{display:flex;align-items:center;gap:12px}.two b{font-size:22px;color:var(--mute)}
.two .lab{font-size:11px;font-weight:800;text-align:center;margin-top:6px;color:var(--sub)}
.kp{display:grid;grid-template-columns:repeat(3,30px);gap:6px;background:#2a2a2a;padding:12px;border-radius:16px;box-shadow:0 12px 24px -10px rgba(0,0,0,.5)}
.kp u{text-decoration:none;height:26px;border-radius:7px;background:#4a4a4a;font-size:12px;display:grid;place-items:center;color:#ddd}
.kp u.hi{background:#fff;color:#111;animation:pulse 1.4s infinite}
.br{display:flex;gap:7px;background:#d9d6cf;padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 2px #c9c5bc}
.br u{width:16px;height:52px;background:#fff;border-radius:4px;position:relative}
.br u:after{content:"";position:absolute;left:2px;right:2px;top:3px;height:20px;background:#16a34a;border-radius:2px;animation:flip .6s both}
@keyframes flip{from{top:29px;background:#9ca3af}to{top:3px}}
.emo{font-size:84px;line-height:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.18))}
/* food */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--sub)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fd{display:flex;gap:14px;margin:12px 16px 0;background:var(--card);border-radius:22px;padding:14px;box-shadow:0 10px 26px -20px rgba(15,61,62,.5);animation:pop .35s both}
.fd .e{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:#FFF4E2}
.fd .b{flex:1;min-width:0}
.fd .b b{display:block;font-size:16px;line-height:1.3}
.fd .b .d{font-size:13px;color:var(--sub)}
.fd .b .w{font-size:13px;margin-top:4px}
.fd .act{display:flex;gap:8px;margin-top:10px}
.fd .act a,.fd .act button{border:0;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;text-decoration:none;background:#F1EEE7}
.fd .act a{background:var(--deep);color:#fff}
.fd .act button.on{background:#FFF1D6;color:#9A5B00}
.fnote{font-size:12px;color:var(--mute);margin:14px 20px 0}
.empty{margin:18px 16px;color:var(--sub);text-align:center}
/* bottom help bar */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:488px;z-index:9;
  background:rgba(20,32,31,.94);color:#fff;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;
  backdrop-filter:blur(10px);box-shadow:0 18px 40px -16px rgba(0,0,0,.55);font-size:13.5px;line-height:1.35}
.dock i{font-style:normal;font-size:22px}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:26px}
.foot button{border:0;background:none;color:var(--sub);font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="dock"><i>💬</i><div><b>Need help?</b> Message us where you booked — we reply fast.</div></div>
<script>
const DATA = {{ data|tojson }};
const APTS = {{ apts|tojson }};
const COL = {door:['#0F766E','#E3F4F1'], water:['#2563EB','#E6EEFE'], laundry:['#7C3AED','#F0EAFE'],
             checkout:['#EA580C','#FFEDE1'], wifi:['#0891B2','#E1F5FA'], food:['#DC2626','#FFE9E6']};
const KINDS = {pho:'Phở', bun:'Noodles', banhcuon:'Rice rolls', rice:'Rice & xôi', fish:'Chả cá', coffee:'Coffee'};
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const en = o => o ? (o.en || '') : '';
let saved = store.get('hd_food', []), fKind = 'all', step = 0, dir = '';
const secBy = id => DATA && DATA.secs.find(s => s.id === id);

function pic(p){
  const rm = h => `<div class="rm"><u class="${h==='up'?'hi':''}">▲</u><u class="${h==='stop'?'hi':''}">■</u><u class="${h==='down'?'hi':''}">▼</u></div>`;
  switch(p){
    case 'up': return rm('up');
    case 'down': return rm('down');
    case 'stop_up': return `<div class="two"><div>${rm('stop')}<div class="lab">1 · UNLOCK</div></div><b>→</b><div>${rm('up')}<div class="lab">2 · OPEN</div></div></div>`;
    case 'keypad': return `<div class="kp">${[1,2,3,4,5,6,7,8,9,'*',0,'#'].map((d,i)=>`<u class="${i===4?'hi':''}">${d}</u>`).join('')}</div>`;
    case 'breaker': return `<div class="br"><u></u><u style="animation-delay:.1s"></u><u></u><u></u><u></u></div>`;
    case 'wait': return `<div class="emo">⏳</div>`;
    case 'washer': return `<div class="emo">🧺</div>`;
    case 'clock': return `<div class="emo">🕛</div>`;
    case 'off': return `<div class="emo">💡</div>`;
    case 'key_room': return `<div class="emo">🔑</div>`;
    case 'key_shelf': return `<div class="two"><div class="emo" style="font-size:60px">🗝️</div><b>→</b>${rm('down')}</div>`;
    case 'wifi': return `<div class="emo">📶</div>`;
  }
  return '<div class="emo">✨</div>';
}

/* ---------- screens ---------- */
function chooser(){
  const last = store.get('hd_apt', null);
  return `<div class="screen ${dir}"><div class="hero"><div class="brand"><i>✦</i> Guest Guide</div>
      <div class="lantern">🏮</div><h1>Welcome to<br>Hanoi Old Quarter</h1><p>Choose the apartment you are staying in.</p></div>
    <div class="pad"><div class="h2">Your apartment</div>
    ${APTS.map((a,i) => `<a class="apt ${last===a.key?'last':''}" href="/hd/${a.key}" style="animation-delay:${i*60}ms">
        <div class="num" style="background:${a.color}">${esc(a.no)}</div><div><b>${esc(a.name)}</b><small>${esc(a.tag)}</small></div><div class="go">›</div></a>`).join('')}
    </div></div>`;
}

function home(){
  const tiles = DATA.secs.map((s,i) => {
    const [c,bg] = COL[s.id] || ['#111','#eee'];
    const odd = DATA.secs.filter(x => x.id !== 'food').length % 2;     // keep the 2-column grid even
    const wide = s.id === 'food' || (s.id === 'wifi' && odd);
    return `<button class="tile ${wide?'wide':''}" style="animation-delay:${80+i*55}ms" onclick="H.open('${s.id}')">
      <div class="ic" style="background:${bg};color:${c}">${s.icon}</div><div><b>${esc(en(s.title))}</b><span style="display:block">${esc(en(s.line))}</span></div>
      <div class="arrow">›</div></button>`;
  }).join('');
  return `<div class="screen ${dir}"><div class="hero"><div class="brand"><i>✦</i> Guest Guide</div><div class="lantern">🏮</div>
      <h1>Welcome home!</h1><p>${esc(DATA.name)} · Hanoi Old Quarter</p>
      <div class="chips"><span>🕛 Check-out 12:00</span><span>📶 Wifi: see your room</span></div><div style="height:14px"></div></div>
    <div class="pad"><div class="tiles">${tiles}</div>
    <div class="foot">Not ${esc(DATA.name)}? <button onclick="H.apts()">Change apartment</button></div></div></div>`;
}

function topic(id){
  const s = secBy(id); if (!s) return home();
  const [c,bg] = COL[id] || ['#111','#eee'];
  const top = `<div class="bar"><button onclick="H.home()">‹ All topics</button><div class="t">${esc(DATA.name)}</div></div>
    <div class="thero" style="background:linear-gradient(135deg,${c},${shade(c)})"><div class="big">${s.icon}</div>
      <h1>${esc(en(s.title))}</h1><p>${esc(en(s.line))}</p></div>`;
  if (id === 'food') return `<div class="screen ${dir}" style="--c:${c}">${top}${food()}</div>`;
  const steps = s.steps || [], n = steps.length;
  step = Math.max(0, Math.min(step, n-1));
  let body;
  if (n > 1) {
    const [p, t] = steps[step];
    body = `<div class="prog">${steps.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
      <div class="card" id="card"><div class="stage" key="${step}">${pic(p)}</div>
        <div class="body"><div class="k">Step ${step+1} of ${n}</div><div class="txt">${esc(en(t))}</div></div></div>
      <div class="nav">${step>0?`<button class="prev" onclick="H.step(-1)">‹ Back</button>`:''}
        ${step<n-1?`<button class="next" onclick="H.step(1)">Next step ›</button>`:`<button class="next" onclick="H.home()">Done ✓</button>`}</div>`;
  } else {
    body = n ? `<div class="card" style="margin-top:16px"><div class="stage">${pic(steps[0][0])}</div><div class="body"><div class="txt">${esc(en(steps[0][1]))}</div></div></div>` : '';
  }
  let extra = '';
  if (s.tip) extra += `<div class="note tip">✓ <span>${esc(en(s.tip))}</span></div>`;
  if (s.warn) extra += `<div class="note warn">⚠ <span>${esc(en(s.warn))}</span></div>`;
  if (s.ask) extra += `<div class="help">${esc(en(s.ask))}<button onclick="this.nextElementSibling.hidden=false;this.remove()">Yes — still not working</button>
      <div class="ans" hidden>So sorry! Please message us on the app you booked with (Booking.com / Airbnb / WhatsApp) and we will fix it right away.</div></div>`;
  if (n > 1) extra += `<button class="all" onclick="H.all('${id}')">Show all steps on one page</button>`;
  return `<div class="screen ${dir}" style="--c:${c};--cbg:${bg}">${top}${body}${extra}</div>`;
}

function allSteps(id){
  const s = secBy(id), [c,bg] = COL[id] || ['#111','#eee'];
  return `<div class="screen ${dir}" style="--c:${c};--cbg:${bg}"><div class="bar"><button onclick="H.open('${id}')">‹ Step by step</button><div class="t">${esc(en(s.title))}</div></div>
    <div class="list">${s.steps.map(([p,t],i)=>`<div class="row"><div class="n">${i+1}</div><div>${esc(en(t))}</div></div>`).join('')}</div>
    ${s.tip?`<div class="note tip">✓ <span>${esc(en(s.tip))}</span></div>`:''}${s.warn?`<div class="note warn">⚠ <span>${esc(en(s.warn))}</span></div>`:''}</div>`;
}

function food(){
  const list = DATA.food || [];
  const kinds = [...new Set(list.map(f => f.kind))];
  const rows = list.filter(f => fKind==='all' || (fKind==='saved' ? saved.includes(f.name) : f.kind===fKind));
  const chips = [['all','All'], ...kinds.map(k => [k, KINDS[k]||k]), ['saved', `★ My list${saved.length?' ('+saved.length+')':''}`]]
    .map(([k,l]) => `<button class="${fKind===k?'on':''}" onclick="H.kind('${k}')">${esc(l)}</button>`).join('');
  const cards = rows.length ? rows.map((f,i) => {
    const on = saved.includes(f.name);
    return `<div class="fd" style="animation-delay:${i*40}ms"><div class="e">${f.emoji||'🍽'}</div><div class="b"><b>${esc(f.name)}</b>
      <div class="d">${esc(en(f.dish))} · ${esc(f.addr)}${f.price?' · ~'+esc(f.price)+' VND':''}</div>${f.why?`<div class="w">${esc(en(f.why))}</div>`:''}
      <div class="act"><a href="${esc(f.map)}" target="_blank" rel="noopener">📍 Directions</a>
      <button class="${on?'on':''}" data-n="${esc(f.name)}" onclick="H.save(this.dataset.n)">${on?'★ Saved':'☆ Save'}</button></div></div></div>`;
  }).join('') : `<div class="empty">Nothing saved yet — tap ☆ Save on a place you like.</div>`;
  return `<div class="chips">${chips}</div>${cards}<div class="fnote">Prices are approximate and opening hours change — check the map before you go. Enjoy your meal! 🥢</div>`;
}

function shade(hex){ const n = parseInt(hex.slice(1),16); const f = v => Math.max(0, Math.round(v*0.72));
  return '#'+[f(n>>16), f((n>>8)&255), f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join(''); }

/* ---------- routing (history so the iPhone back swipe works) ---------- */
function view(){ const q = new URLSearchParams(location.search); return {s:q.get('s'), all:q.get('all')}; }
function render(){
  const v = view(), app = document.getElementById('app');
  if (!DATA) app.innerHTML = chooser();
  else if (v.s && v.all) app.innerHTML = allSteps(v.s);
  else if (v.s) app.innerHTML = topic(v.s);
  else app.innerHTML = home();
  dir = '';
  const card = document.getElementById('card');
  if (card) { let x0 = null;
    card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, {passive:true});
    card.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) H.step(dx < 0 ? 1 : -1); }); }
}
function go(qs, back){ history.pushState({}, '', location.pathname + qs); dir = back ? 'back' : ''; render(); scrollTo(0,0); }
const H = {
  open(id){ step = 0; fKind = 'all'; go('?s='+id); },
  home(){ go('', true); },
  apts(){ location.href = '/hd'; },
  all(id){ go('?s='+id+'&all=1'); },
  step(d){ const s = secBy(view().s); if (!s) return; const n = s.steps.length; const ns = step + d;
    if (ns < 0 || ns >= n) return; step = ns; dir = d < 0 ? 'back' : ''; render(); },
  kind(k){ fKind = k; const y = scrollY; render(); scrollTo(0, y); },
  save(n){ saved = saved.includes(n) ? saved.filter(x => x!==n) : saved.concat(n); store.set('hd_food', saved); const y = scrollY; render(); scrollTo(0, y); },
};
addEventListener('popstate', () => { step = 0; dir = 'back'; render(); });
if (DATA) store.set('hd_apt', DATA.key);
render();
</script>
</body>
</html>
