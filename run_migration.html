<!DOCTYPE html>
<html>
<head>
    <title>Database Migration Tool</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🔧 Database Migration Tool</h1>
    <p>Click the button below to add the missing <code>image_path</code> column to your message_templates table:</p>
    
    <button class="btn" onclick="runMigration()">Run Database Migration</button>
    
    <div id="result"></div>

    <script>
        async function runMigration() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info">🔄 Running migration...</div>';
            
            try {
                const response = await fetch('/api/migrate_database', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>✅ Migration Successful!</h3>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Action:</strong> ${data.action}</p>
                            <p>🎉 Your template image upload feature is now ready!</p>
                            <p>You can now refresh your AI Assistant page to use the new features.</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ Migration Failed</h3>
                            <p><strong>Error:</strong> ${data.message}</p>
                            <p>Please try the manual SQL approach or check your database connection.</p>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Network Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Make sure your Flask application is running and try again.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
