<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Fixes Test</title>
</head>
<body>
    <h1>JavaScript Fixes Verification</h1>
    
    <div id="test-results">
        <h2>Test Results:</h2>
        <div id="results"></div>
    </div>

    <script>
        // Test apartment selection variables
        let selectedApartment = null;
        const APARTMENTS = {
            1: { name: 'Apartment 1', color: 'primary' },
            2: { name: 'Apartment 2', color: 'success' }
        };
        
        // Test duplicate handling variables
        let duplicateGroups = [];
        let keptBookings = [];
        let currentAIAnalysisData = null;
        let extractedBookings = [];
        
        // Test functions
        function selectApartment(apartmentId) {
            selectedApartment = apartmentId;
            const apartment = APARTMENTS[apartmentId];
            return `Selected apartment ${apartmentId}: ${apartment.name}`;
        }
        
        function keepExtractedBooking(index) {
            return `Keep booking at index ${index}`;
        }
        
        function skipDuplicateBooking(index) {
            return `Skip booking at index ${index}`;
        }
        
        // Run tests
        function runTests() {
            const results = [];
            
            try {
                // Test 1: selectApartment function
                const selectResult = selectApartment(1);
                results.push(`✅ selectApartment(1): ${selectResult}`);
                results.push(`✅ selectedApartment = ${selectedApartment}`);
            } catch (e) {
                results.push(`❌ selectApartment test failed: ${e.message}`);
            }
            
            try {
                // Test 2: duplicate handling functions
                results.push(`✅ keepExtractedBooking(0): ${keepExtractedBooking(0)}`);
                results.push(`✅ skipDuplicateBooking(0): ${skipDuplicateBooking(0)}`);
            } catch (e) {
                results.push(`❌ Duplicate handling test failed: ${e.message}`);
            }
            
            try {
                // Test 3: variable declarations
                results.push(`✅ duplicateGroups is array: ${Array.isArray(duplicateGroups)}`);
                results.push(`✅ APARTMENTS has key '1': ${APARTMENTS.hasOwnProperty('1')}`);
            } catch (e) {
                results.push(`❌ Variable test failed: ${e.message}`);
            }
            
            return results;
        }
        
        // Display results
        document.addEventListener('DOMContentLoaded', function() {
            const results = runTests();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = results.map(r => `<div>${r}</div>`).join('');
        });
    </script>
</body>
</html>
