[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.gunicorn"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "pip install -r requirements.txt"
]

[phases.build]
dependsOn = ["install"]

[start]
cmd = "python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"