services:
  - type: web
    name: hotel-booking-system
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_SOURCE
        value: auto
      - key: FLASK_APP
        value: app.py
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-postgres
          property: connectionString
    healthCheckPath: /

databases:
  - name: hotel-postgres
    plan: free
    region: singapore
    databaseName: hotel_booking
    user: postgres
