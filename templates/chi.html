<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nộp tiền & Chi tiêu</title>
<style>
  :root { --ink:#0E1525; --mut:#64748B; --soft:#94A3B8; --line:#E7E9EE; --bg:#F4F5F7; --bar:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  button { font-family:inherit; cursor:pointer; }
  .wrap { max-width:680px; margin:0 auto; padding:14px 16px 60px; }
  .top { display:flex; align-items:center; gap:8px; }
  .top a { color:var(--ink); text-decoration:none; font-weight:800; font-size:24px; padding:4px 8px 4px 0; }
  h1 { margin:0; font-size:21px; flex:1; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:12px; }
  .h { font-size:13px; font-weight:800; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .big { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .mut { color:var(--mut); font-size:13px; font-weight:600; }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:2px; }
  .chip { flex:none; min-height:38px; padding:0 12px; border-radius:12px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:13px; color:var(--ink); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .stats { display:flex; gap:14px; margin-top:6px; flex-wrap:wrap; }
  .brk { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 0; border-top:1px solid var(--line); color:var(--ink); }
  .brk:first-of-type { border-top:0; }
  .brk .l { display:flex; justify-content:space-between; gap:8px; font-weight:800; font-size:14.5px; }
  .brk .track { height:6px; border-radius:4px; background:#EEF0F3; margin-top:6px; overflow:hidden; }
  .brk .fill { height:100%; background:var(--bar); border-radius:4px; }
  .brk.on .l { color:#0F172A; } .brk.on .fill { background:#0F172A; }
  .brk.dim .l { color:var(--soft); } .brk.dim .fill { background:#CBD5E1; }
  .brk .pc { color:var(--mut); font-weight:700; font-size:12.5px; margin-left:6px; }
  .flt { display:flex; align-items:center; gap:8px; margin-top:12px; padding:10px 12px; border-radius:12px; background:#0E1525; color:#fff; font-weight:800; font-size:14px; }
  .flt span { flex:1; }
  .flt button { min-height:32px; border-radius:9px; border:0; background:#fff; color:var(--ink); font-weight:800; padding:0 10px; }
  .day { display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:var(--mut); margin:16px 4px 6px; }
  .day:first-child { margin-top:4px; }
  .it { display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .it:first-child { border-top:0; }
  .thumb { width:118px; height:158px; object-fit:cover; object-position:center 22%; border-radius:8px; border:1px solid var(--line); flex:none; background:#eee; }
  .ico { width:46px; height:60px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; background:#F1F5F9; }
  .bd { flex:1; min-width:0; }
  .r1 { display:flex; gap:8px; align-items:baseline; }
  .ttl { flex:1; font-weight:800; font-size:15px; overflow-wrap:anywhere; }
  .amt { font-weight:800; font-size:16px; }
  .amt.in { color:#15803D; }
  .three { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .three .left { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:baseline; }
  .three > div { background:#F6F7F9; border-radius:12px; padding:10px; min-width:0; }
  .three .v { font-weight:800; font-size:17px; margin-top:2px; overflow-wrap:anywhere; }
  .three .in .v { color:#15803D; }
  .kseg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
  .kseg button { min-height:44px; border-radius:12px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:14px; color:var(--ink); }
  .kseg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .kseg button.on.kin { background:#15803D; border-color:#15803D; }
  span.tag.in { background:#DCFCE7; border-color:#DCFCE7; color:#166534; }
  .sub { font-size:13px; color:#475569; margin-top:2px; overflow-wrap:anywhere; }
  .said { font-size:12.5px; color:var(--soft); margin-top:2px; overflow-wrap:anywhere; white-space:pre-line; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .tag { min-height:30px; padding:0 9px; border-radius:9px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:12.5px; color:var(--ink); }
  span.tag { display:inline-flex; align-items:center; background:#F1F5F9; border-color:#F1F5F9; }
  .tag.empty { border-style:dashed; color:#92400E; border-color:#FCD34D; background:#FFFBEB; }
  .tag.ed { margin-left:auto; }
  .tag.ed + .x { margin-left:0; }
  .fl { display:block; margin-top:10px; font-size:12.5px; font-weight:800; color:var(--mut); }
  .fl input, .fl .sel { margin-top:4px; }
  .sel { width:100%; min-height:44px; padding:0 10px; border:1px solid #CBD5E1; border-radius:12px; font-size:16px; background:#fff; font-family:inherit; color:var(--ink); }
  .x { margin-left:auto; min-height:30px; padding:0 9px; border-radius:9px; border:1px solid #F1D4D4; background:#fff; font-weight:800; font-size:12px; color:#B91C1C; }
  .btn { min-height:44px; padding:0 14px; border-radius:12px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:14px; color:var(--ink); }
  .btn.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  .shr { min-height:38px; padding:0 12px; border-radius:11px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:13.5px; color:var(--ink); }
  textarea, input { width:100%; margin-top:8px; padding:10px 12px; border:1px solid #CBD5E1; border-radius:12px; font-size:16px; resize:none; font-family:inherit; }
  .warn { margin-top:8px; border-radius:12px; padding:10px 12px; font-size:13.5px; font-weight:700; background:#FEF3C7; color:#92400E; line-height:1.5; }
  .ok { color:#15803D; font-weight:800; }
  .ro { display:inline-block; margin-left:6px; padding:2px 8px; border-radius:8px; background:#E2E8F0; color:#334155; font-size:12px; font-weight:800; vertical-align:middle; }
  #sh { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:flex-end; z-index:8; }
  #sh .in { background:#fff; width:100%; max-width:680px; margin:0 auto; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sh .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  #sh .opts .btn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #ov { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:9; }
  #ov img { max-width:100%; max-height:100%; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; background:#E6E8EC; padding:4px; border-radius:14px; }
  .tabs button { min-height:42px; border:0; border-radius:11px; background:none; font-weight:800; font-size:14.5px; color:#475569; }
  .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(15,23,42,.12); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .two > div { padding:10px 12px; border-radius:12px; background:#F7F8FA; }
  .two .v { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }
  .pots { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pot { padding:12px; border-radius:12px; background:#F7F8FA; }
  .pot .v { font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }
  table.hist { width:100%; border-collapse:collapse; font-size:13px; }
  table.hist th { text-align:right; color:var(--mut); font-weight:800; font-size:12px; padding:6px 0; }
  table.hist th:first-child, table.hist td:first-child { text-align:left; padding-left:0; white-space:normal !important; }
  table.hist th, table.hist td { padding-left:10px; white-space:nowrap; }
  table.hist td { text-align:right; padding-top:7px; padding-bottom:7px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; font-weight:700; }
  .foot { text-align:center; color:var(--soft); font-size:12px; margin-top:18px; }
  /* 🖥️ computer list = cards with a BIG receipt picture (owner Nov 24: "khó nhìn … làm ảnh to hơn nhiều nữa") */
  .gday { display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 10px; }
  .gday:first-child { margin-top:6px; }
  .gday b { font-size:15px; } .gday span { font-weight:800; color:#475569; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:16px; }
  .gc { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .gc:hover { box-shadow:0 6px 18px rgba(15,23,42,.10); }
  .gc .pic { height:380px; background:#F1F5F9; border-bottom:1px solid var(--line); cursor:zoom-in; }
  .gc .pic img { width:100%; height:100%; object-fit:cover; object-position:center 18%; display:block; }
  .gc .vo { flex:1 0 150px; background:#F8FAFC; border-bottom:1px solid var(--line); padding:16px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .gc .vo .q { font-size:15px; color:#334155; font-style:italic; overflow-wrap:anywhere; }
  .gc .bd2 { padding:12px 14px 12px; display:flex; flex-direction:column; gap:4px; }
  .gc .amt2 { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .gc .amt2.in { color:#15803D; }
  .gc .who { font-weight:800; font-size:14.5px; overflow-wrap:anywhere; }
  .gc .nd { font-size:13px; color:#475569; overflow-wrap:anywhere; }
  .gc .meta { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin-top:8px; font-size:13px; }
  .gc .meta dt { color:var(--mut); font-weight:600; } .gc .meta dd { margin:0; font-weight:700; min-width:0; }
  .lnk { border:0; background:none; padding:0; font:inherit; font-weight:700; color:var(--ink); text-align:left; border-bottom:1px dashed #94A3B8; cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lnk.none { color:#B45309; border-bottom-color:#F59E0B; font-weight:600; }
  .gc .foot2 { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--mut); }
  .gc .foot2 .sp { flex:1; }
  .gbtn { min-height:32px; padding:0 12px; border-radius:9px; border:1px solid #DDE1E7; background:#fff; font-weight:700; font-size:13px; color:var(--ink); }
  .gbtn.del { color:#B91C1C; border-color:#F1D4D4; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:800; background:#DCFCE7; color:#166534; }
  @media (min-width: 1000px) {
    .wrap { max-width:1320px; padding:20px 28px 60px; }
    .top h1 { font-size:24px; }
    #pChi { display:grid; grid-template-columns:360px minmax(0, 1fr); grid-template-areas:"side main" "bot main"; gap:0 20px; align-items:start; }
    #pChi .side { grid-area:side; } #pChi .main { grid-area:main; } #pChi #bot { grid-area:bot; }
    #pChi .main #list { margin-top:4px; padding:0; background:none; border:0; }
    .tabs { max-width:360px; }
    .pots { grid-template-columns:repeat(4, 1fr); }
    #pNop { max-width:900px; }
    #sh { align-items:center; }
    #sh .in { max-width:520px; border-radius:18px; max-height:92vh; overflow:auto; }
    .thumb { cursor:zoom-in; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    {% if not share %}<a href="/" aria-label="Về trang chính">‹</a>{% endif %}
    <h1>Nộp & Chi{% if share %} <span class="ro">Chỉ xem</span>{% endif %}</h1>
    {% if not share %}<button class="shr" onclick="Chi.share()">🔗 Chia sẻ</button>{% endif %}
  </div>
  <div id="chips" class="chips"></div>
  <div id="sum" class="card"><div class="mut">Đang tải…</div></div>
  <div class="tabs"><button id="tChi" onclick="Chi.tab('chi')">💸 Chi tiêu</button><button id="tNop" onclick="Chi.tab('nop')">📒 Nộp tiền</button></div>
  <div id="pChi">
    <div class="side">
      {% if not share %}<button class="btn dark" style="width:100%;margin-top:12px" onclick="Chi.add()">➕ Thêm khoản thu / chi</button>{% endif %}
      <div id="chiSum" class="card"></div>
      <div id="kinds" class="chips"></div>
      <div id="brk"></div>
    </div>
    <div class="main">
      <div id="flt"></div>
      <div id="list" class="card" style="display:none"></div>
    </div>
    {% if not share %}<div id="bot" class="card"></div>{% endif %}
  </div>
  <div id="pNop" style="display:none"></div>
  <div id="foot" class="foot"></div>
</div>
<div id="sh" onclick="if(event.target===this)this.style.display='none'"><div class="in" id="shIn"></div></div>
<div id="ov" onclick="this.style.display='none'"><img id="ovImg" alt="Biên lai"></div>
<script>
(() => {
  const SHARE = {{ share|tojson }};      // '' = the owner's page · a secret = the read-only page others open
  const RO = !!SHARE;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';
  const monLbl = (m) => { const [y, mo] = m.split('-'); return 'Tháng ' + Number(mo) + '/' + y; };
  const WD = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  const dayLbl = (d) => { const [y, m, dd] = d.split('-').map(Number); return WD[new Date(y, m - 1, dd).getDay()] + ', ' + dd + '/' + m; };
  const attr = (v) => esc(JSON.stringify(v));
  // the bank's automatic transfer text ("X chuyen khoan nhanh qua Zalo", "… chuyen tien QR") says nothing about the expense
  const AUTO_NOTE = /chuyen (khoan|tien)( nhanh)?( qua zalo| qr)?\s*$/i;
  let month = '', J = null, D = null, F = { apt: null, payer: null, kind: null };
  let TAB = location.hash === '#nop' ? 'nop' : 'chi';
  // 🖥️ computer (owner Nov 24 "Nộp & Chi trên máy tính"): ≥1000px → 2 columns, the list as a table
  const WIDE = matchMedia('(min-width: 1000px)');
  function gallery(shown, dayTot) {
    const q = SHARE ? '?t=' + encodeURIComponent(SHARE) : '';
    const pick = (r, key, txt, emptyTxt) => RO ? esc(txt || '—')
      : `<button class="lnk${txt ? '' : ' none'}" onclick="Chi.pick(${r.id}, '${key}')">${esc(txt || emptyTxt)}</button>`;
    let html = '', day = '';
    for (const r of shown) {
      if (r.day !== day) {
        if (day) html += '</div>';
        day = r.day;
        html += `<div class="gday"><b>${esc(dayLbl(day))}</b><span>${dayTot(day)}</span></div><div class="grid">`;
      }
      const v = view(r), thu = r.kind === 'thu';
      html += `<div class="gc">
        ${r.img ? `<div class="pic" onclick="Chi.show(${r.id})"><img src="/api/chi/img/${r.id}${q}" loading="lazy" alt="Biên lai"></div>`
                : `<div class="vo"><div class="mut">🎤 Ghi bằng lời</div>${v.said ? `<div class="q">${esc(v.said.replace(/^Lời nói: /, ''))}</div>` : ''}</div>`}
        <div class="bd2">
          <div class="amt2${thu ? ' in' : ''}">${thu ? '+' : ''}${money(r.amount)}</div>
          <div class="who">${esc(v.title)}</div>
          ${v.sub ? `<div class="nd">${esc(v.sub)}</div>` : ''}
          <dl class="meta"><dt>${thu ? 'Từ ai' : 'Ai trả'}</dt><dd>${pick(r, 'payer', r.payer, 'Chọn người')}</dd>
            <dt>Căn</dt><dd>${pick(r, 'apt', r.apt, 'Chọn căn')}</dd></dl>
        </div>
        <div class="foot2">${esc(r.at.split(' ')[0])}${thu ? ' <span class="pill">Thu</span>' : ''}<span class="sp"></span>
          ${RO ? '' : `<button class="gbtn" onclick="Chi.edit(${r.id})">Sửa</button><button class="gbtn del" onclick="Chi.del(${r.id}, '${money(r.amount)}')">Xóa</button>`}</div>
      </div>`;
    }
    return html + (day ? '</div>' : '');
  }
  WIDE.addEventListener('change', () => { if (J) draw(); });
  function tab(t) {
    TAB = t;
    try { history.replaceState(null, '', t === 'nop' ? '#nop' : location.pathname); } catch (e) {}
    $('tChi').classList.toggle('on', t === 'chi'); $('tNop').classList.toggle('on', t === 'nop');
    $('pChi').style.display = t === 'chi' ? '' : 'none'; $('pNop').style.display = t === 'nop' ? '' : 'none';
  }
  // 📒 Sổ nộp tiền (the Thu tiền tab of /moi writes it; here it is only shown) — owner, Nov 23: "gộp chung cả link nộp tiền và chi tiêu"
  function drawNop() {
    if (!D || !D.success) { $('pNop').innerHTML = '<div class="card mut">Chưa tải được sổ nộp tiền.</div>'; return; }
    const tot = D.pots.reduce((a, p) => a + p.total, 0);
    let html = `<div class="card"><div class="h">Đã nộp · ${esc(monLbl(D.month))}</div><div class="big">${money(tot)}</div>
      <div class="pots" style="margin-top:10px">${D.pots.map((p) => `<div class="pot"><div style="font-weight:800">${esc(p.name)}</div>
        <div class="mut" style="font-size:12px">${esc(p.sub)}</div><div class="v">${money(p.total)}</div><div class="mut">${p.count} lần nộp</div></div>`).join('')}</div>
      ${RO ? '' : '<div class="mut" style="margin-top:10px">Ghi thêm: trang chính → tab Thu tiền → 📒 Sổ nộp tiền.</div>'}</div>`;
    const name = Object.fromEntries(D.pots.map((p) => [p.key, p.name]));
    if (D.rows.length) {
      const sumDay = {};
      for (const r of D.rows) sumDay[r.day] = (sumDay[r.day] || 0) + r.amount;
      let day = '';
      html += '<div class="card">';
      for (const r of D.rows) {
        if (r.day !== day) { day = r.day; html += `<div class="day"><span>${esc(dayLbl(day))}</span><span class="num">${money(sumDay[day])}</span></div>`; }
        html += `<div class="it" style="align-items:center"><div class="ico" style="height:44px">📒</div><div class="bd"><div class="r1"><div class="ttl">Nộp ${esc(name[r.pot] || r.pot)}</div>
          <div class="amt num">${money(r.amount)}</div></div>${r.note ? `<div class="sub">${esc(r.note)}</div>` : ''}<div class="mut">${esc(r.at.split(' ')[0])}</div></div></div>`;
      }
      html += '</div>';
    } else html += '<div class="card mut">Tháng này chưa có lần nộp nào.</div>';
    const hist = D.months.filter((m) => D.pots.some((p) => m[p.key]));
    if (hist.length) html += `<div class="card"><div class="h">6 tháng gần đây</div><table class="hist"><tr><th>Tháng</th>${D.pots.map((p) => `<th>${esc(p.name)}</th>`).join('')}<th>Tổng</th></tr>`
      + hist.map((m) => `<tr><td>${esc(monLbl(m.month))}</td>${D.pots.map((p) => `<td>${money(m[p.key])}</td>`).join('')}<td>${money(D.pots.reduce((a, p) => a + m[p.key], 0))}</td></tr>`).join('') + '</table></div>';
    $('pNop').innerHTML = html;
  }

  function view(r) {          // one item → title / details / the words said
    const lines = String(r.note || '').split('\n');
    const said = lines.filter((x) => x.startsWith('🎤')).map((x) => x.replace(/^🎤\s*/, '')).join(' ');
    const note = lines.filter((x) => !x.startsWith('🎤')).join(' ').split(' · ').filter((x) => x && !AUTO_NOTE.test(x)).join(' · ');
    if (r.img) return { title: r.to || 'Chuyển khoản', sub: [note && 'ND: ' + note, r.bank].filter(Boolean).join(' · '), said: '' };
    return { title: note || said || '—', sub: r.to ? 'Trả cho: ' + r.to : '', said: said ? 'Lời nói: “' + said + '”' : '' };
  }
  function breakdown(items, key, title, emptyLbl, order) {
    const m = new Map(), tot = items.reduce((a, r) => a + r.amount, 0) || 1;
    for (const r of items) m.set(r[key], (m.get(r[key]) || 0) + r.amount);

        <div style="display:flex;margin-top:8px"><button class="btn dark" onclick="Chi.bot('token')">Lưu & kết nối bot</button></div>`;
      return;
    }
    $('bot').innerHTML = `<div style="font-size:15px;font-weight:800">🤖 Bot Zalo "Chi tiêu" <span class="ok">✓ ${esc(j.bot_name || 'đã kết nối')}</span></div>
      <div style="font-size:13.5px;color:#475569;line-height:1.5;margin-top:4px">🎤 Bấm <b>micro trên bàn phím</b>, nói khoản đã chi → bot ghi rõ từng khoản. 🧾 Chuyển khoản xong → <b>Chia sẻ</b> biên lai → gửi vào bot. Bot lưu ngày giờ + số tiền, trả lời tổng tháng. Nhắn <b>"tháng này"</b> xem tổng · <b>"xóa"</b> bỏ khoản vừa lưu. Ngày 1 hằng tháng bot gửi tổng tháng trước.</div>
      ${j.chats.length ? '<div class="mut" style="margin-top:8px">Được gửi biên lai:</div>' + j.chats.map((c) => `<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><b style="flex:1;font-size:14px">${esc(c.name)}</b><button class="x" onclick="Chi.bot('remove','${esc(c.id)}')">Bỏ</button></div>`).join('') : ''}
      ${j.open ? '<div class="warn">Đang mở 30 phút: ai nhắn cho bot lúc này sẽ được gửi biên lai. Mở Zalo, tìm bot và nhắn "alo".</div>'
               : (j.chats.length ? '' : '<div class="warn">Chưa ai kết nối. Bấm "Cho thêm người" rồi nhắn "alo" cho bot trong Zalo.</div>')}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="Chi.bot('open')">Cho thêm người</button><button class="btn" onclick="Chi.bot('off')">Bỏ bot này</button></div>`;
  }
  async function post(url, body) {
    try { return await (await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json(); } catch (e) { return {}; }
  }
  window.Chi = {
    load, pick, share, tab, edit, add,
    filt: (key, v) => { if (!key) F = { apt: null, payer: null, kind: F.kind }; else F[key] = F[key] === v ? null : v; draw(); },
    kind: (k) => { F = { apt: null, payer: null, kind: k }; draw(); },
    show: (id) => { $('ovImg').src = '/api/chi/img/' + id + (SHARE ? '?t=' + encodeURIComponent(SHARE) : ''); $('ov').style.display = 'flex'; },
    del: async (id, amt) => { if (!confirm('Xóa khoản ' + amt + '?')) return; await post('/api/chi/delete', { id }); load(month); },
    bot: async (action, id) => {
      if (action === 'off' && !confirm('Bỏ bot chi tiêu? Biên lai đã lưu vẫn giữ.')) return;
      const body = { action, id };
      if (action === 'token') body.token = ($('tok') || {}).value || '';   // the server picks the token out (even from the whole Zalo message)
      const j = await post('/api/chi/bot', body);
      if (!j.success) return alert('Chưa được: ' + (j.error || 'lỗi mạng'));
      load(month);
    },
  };
  load('');
})();
</script>
</body>
</html>
