<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nộp tiền & Chi tiêu</title>
<style>
  :root { --ink:#0E1525; --mut:#64748B; --soft:#94A3B8; --line:#E7E9EE; --bg:#F4F5F7; --bar:#334155; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  button { font-family:inherit; cursor:pointer; }
  .wrap { max-width:680px; margin:0 auto; padding:14px 16px 60px; }
  .top { display:flex; align-items:center; gap:8px; }
  .top a { color:var(--ink); text-decoration:none; font-weight:800; font-size:24px; padding:4px 8px 4px 0; }
  h1 { margin:0; font-size:21px; flex:1; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:12px; }
  .h { font-size:13px; font-weight:800; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .big { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .mut { color:var(--mut); font-size:13px; font-weight:600; }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chips { display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:2px; }
  .chip { flex:none; min-height:38px; padding:0 12px; border-radius:12px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:13px; color:var(--ink); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .stats { display:flex; gap:14px; margin-top:6px; flex-wrap:wrap; }
  .brk { display:block; width:100%; text-align:left; background:none; border:0; padding:8px 0; border-top:1px solid var(--line); color:var(--ink); }
  .brk:first-of-type { border-top:0; }
  .brk .l { display:flex; justify-content:space-between; gap:8px; font-weight:800; font-size:14.5px; }
  .brk .track { height:6px; border-radius:4px; background:#EEF0F3; margin-top:6px; overflow:hidden; }
  .brk .fill { height:100%; background:var(--bar); border-radius:4px; }
  .brk.on .l { color:#0F172A; } .brk.on .fill { background:#0F172A; }
  .brk.dim .l { color:var(--soft); } .brk.dim .fill { background:#CBD5E1; }
  .brk .pc { color:var(--mut); font-weight:700; font-size:12.5px; margin-left:6px; }
  .flt { display:flex; align-items:center; gap:8px; margin-top:12px; padding:10px 12px; border-radius:12px; background:#0E1525; color:#fff; font-weight:800; font-size:14px; }
  .flt span { flex:1; }
  .flt button { min-height:32px; border-radius:9px; border:0; background:#fff; color:var(--ink); font-weight:800; padding:0 10px; }
  .day { display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:var(--mut); margin:16px 4px 6px; }
  .day:first-child { margin-top:4px; }
  .it { display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .it:first-child { border-top:0; }
  .thumb { width:118px; height:158px; object-fit:cover; object-position:center 22%; border-radius:8px; border:1px solid var(--line); flex:none; background:#eee; }
  .ico { width:46px; height:60px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; background:#F1F5F9; }
  .bd { flex:1; min-width:0; }
  .r1 { display:flex; gap:8px; align-items:baseline; }
  .ttl { flex:1; font-weight:800; font-size:15px; overflow-wrap:anywhere; }
  .amt { font-weight:800; font-size:16px; }
  .amt.in { color:#15803D; }
  .three { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .three .left { grid-column:1 / -1; display:flex; justify-content:space-between; align-items:baseline; }
  .three > div { background:#F6F7F9; border-radius:12px; padding:10px; min-width:0; }
  .three .v { font-weight:800; font-size:17px; margin-top:2px; overflow-wrap:anywhere; }
  .three .in .v { color:#15803D; }
  .kseg { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
  .kseg button { min-height:44px; border-radius:12px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:14px; color:var(--ink); }
  .kseg button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .kseg button.on.kin { background:#15803D; border-color:#15803D; }
  span.tag.in { background:#DCFCE7; border-color:#DCFCE7; color:#166534; }
  .sub { font-size:13px; color:#475569; margin-top:2px; overflow-wrap:anywhere; }
  .said { font-size:12.5px; color:var(--soft); margin-top:2px; overflow-wrap:anywhere; white-space:pre-line; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
  .tag { min-height:30px; padding:0 9px; border-radius:9px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:12.5px; color:var(--ink); }
  span.tag { display:inline-flex; align-items:center; background:#F1F5F9; border-color:#F1F5F9; }
  .tag.empty { border-style:dashed; color:#92400E; border-color:#FCD34D; background:#FFFBEB; }
  .tag.ed { margin-left:auto; }
  .tag.ed + .x { margin-left:0; }
  .fl { display:block; margin-top:10px; font-size:12.5px; font-weight:800; color:var(--mut); }
  .fl input, .fl .sel { margin-top:4px; }
  .sel { width:100%; min-height:44px; padding:0 10px; border:1px solid #CBD5E1; border-radius:12px; font-size:16px; background:#fff; font-family:inherit; color:var(--ink); }
  .x { margin-left:auto; min-height:30px; padding:0 9px; border-radius:9px; border:1px solid #F1D4D4; background:#fff; font-weight:800; font-size:12px; color:#B91C1C; }
  .btn { min-height:44px; padding:0 14px; border-radius:12px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:14px; color:var(--ink); }
  .btn.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  .shr { min-height:38px; padding:0 12px; border-radius:11px; border:1px solid #DDE1E7; background:#fff; font-weight:800; font-size:13.5px; color:var(--ink); }
  textarea, input { width:100%; margin-top:8px; padding:10px 12px; border:1px solid #CBD5E1; border-radius:12px; font-size:16px; resize:none; font-family:inherit; }
  .warn { margin-top:8px; border-radius:12px; padding:10px 12px; font-size:13.5px; font-weight:700; background:#FEF3C7; color:#92400E; line-height:1.5; }
  .ok { color:#15803D; font-weight:800; }
  .ro { display:inline-block; margin-left:6px; padding:2px 8px; border-radius:8px; background:#E2E8F0; color:#334155; font-size:12px; font-weight:800; vertical-align:middle; }
  #sh { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:flex-end; z-index:8; }
  #sh .in { background:#fff; width:100%; max-width:680px; margin:0 auto; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sh .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  #sh .opts .btn.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #ov { position:fixed; inset:0; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; z-index:9; }
  #ov img { max-width:100%; max-height:100%; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px; background:#E6E8EC; padding:4px; border-radius:14px; }
  .tabs button { min-height:42px; border:0; border-radius:11px; background:none; font-weight:800; font-size:14.5px; color:#475569; }
  .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(15,23,42,.12); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .two > div { padding:10px 12px; border-radius:12px; background:#F7F8FA; }
  .two .v { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }
  .pots { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pot { padding:12px; border-radius:12px; background:#F7F8FA; }
  .pot .v { font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }
  table.hist { width:100%; border-collapse:collapse; font-size:13px; }
  table.hist th { text-align:right; color:var(--mut); font-weight:800; font-size:12px; padding:6px 0; }
  table.hist th:first-child, table.hist td:first-child { text-align:left; padding-left:0; white-space:normal !important; }
  table.hist th, table.hist td { padding-left:10px; white-space:nowrap; }
  table.hist td { text-align:right; padding-top:7px; padding-bottom:7px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; font-weight:700; }
  .foot { text-align:center; color:var(--soft); font-size:12px; margin-top:18px; }
  /* 🖥️ computer list = cards with a BIG receipt picture (owner Nov 24: "khó nhìn … làm ảnh to hơn nhiều nữa") */
  .gday { display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 10px; }
  .gday:first-child { margin-top:6px; }
  .gday b { font-size:15px; } .gday span { font-weight:800; color:#475569; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:14px; }
  .gc { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .gc:hover { box-shadow:0 6px 18px rgba(15,23,42,.10); }
  .gc .pic { height:330px; background:#F1F5F9; border-bottom:1px solid var(--line); cursor:zoom-in; }
  .gc .pic img { width:100%; height:100%; object-fit:cover; object-position:center 18%; display:block; }
  .gc .vo { flex:1 0 150px; background:#F8FAFC; border-bottom:1px solid var(--line); padding:16px; display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .gc .vo .q { font-size:15px; color:#334155; font-style:italic; overflow-wrap:anywhere; }
  .gc .bd2 { padding:12px 14px 12px; display:flex; flex-direction:column; gap:4px; }
  .gc .amt2 { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .gc .amt2.in { color:#15803D; }
  .gc .who { font-weight:800; font-size:14.5px; overflow-wrap:anywhere; }
  .gc .nd { font-size:13px; color:#475569; overflow-wrap:anywhere; }
  .gc .meta { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin-top:8px; font-size:13px; }
  .gc .meta dt { color:var(--mut); font-weight:600; } .gc .meta dd { margin:0; font-weight:700; min-width:0; }
  .lnk { border:0; background:none; padding:0; font:inherit; font-weight:700; color:var(--ink); text-align:left; border-bottom:1px dashed #94A3B8; cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lnk.none { color:#B45309; border-bottom-color:#F59E0B; font-weight:600; }
  .gc .foot2 { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--mut); }
  .gc .foot2 .sp { flex:1; }
  .gbtn { min-height:32px; padding:0 12px; border-radius:9px; border:1px solid #DDE1E7; background:#fff; font-weight:700; font-size:13px; color:var(--ink); }
  .gbtn.del { color:#B91C1C; border-color:#F1D4D4; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:800; background:#DCFCE7; color:#166534; }
  @media (min-width: 1000px) {
    .wrap { max-width:none; padding:20px 28px 60px; }
    .top h1 { font-size:24px; }
    #pChi { display:grid; grid-template-columns:290px minmax(0, 1fr) minmax(380px, 30%); grid-template-areas:"side main det" "bot main det"; gap:0 20px; align-items:start; }
    #pChi .side { grid-area:side; } #pChi .main { grid-area:main; } #pChi #bot { grid-area:bot; }
    .det { display:block; grid-area:det; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; margin-top:12px;
      background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; }
    #pChi .main { margin-top:12px; }
    #pChi .side #kinds { display:none; }
    #pChi .main #list { margin-top:4px; padding:0; background:none; border:0; }
    .tabs { max-width:360px; }
    .pots { grid-template-columns:repeat(4, 1fr); }
    #pNop { max-width:900px; }
    #sh { align-items:center; }
    #sh .in { max-width:520px; border-radius:18px; max-height:92vh; overflow:auto; }
    .thumb { cursor:zoom-in; }
  }
  /* ── 📊 Thống kê ── */
  .tabs.t3 { grid-template-columns:1fr 1fr 1fr; }
  .stTop { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:14px; }
  .kps { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kp { margin-top:10px; padding:12px; } .kp .kl { font-size:12px; font-weight:800; color:var(--mut); }
  .kp .kv { font-size:19px; font-weight:800; margin-top:2px; overflow-wrap:anywhere; } .kp .mut { font-size:12px; overflow-wrap:anywhere; }
  .pos { color:#15803D; } .neg { color:#B91C1C; }
  .sh { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .sh b { font-size:14.5px; }
  .dns { display:grid; grid-template-columns:1fr; gap:0 12px; }
  .dw { display:grid; grid-template-columns:150px 1fr; gap:12px; align-items:center; }
  .dn { width:150px; height:150px; } .dn .dt { font-size:9px; font-weight:800; fill:#64748B; } .dn .db { font-size:15px; font-weight:800; fill:#0E1525; }
  .lg { display:flex; flex-direction:column; min-width:0; }
  .lgi { display:grid; grid-template-columns:10px minmax(0,1fr) auto 44px; gap:6px; align-items:center; padding:5px 4px; border:0; border-top:1px solid var(--line);
    background:none; text-align:left; font-size:12.5px; color:var(--ink); border-radius:6px; }
  .lgi:first-child { border-top:0; } .lgi.on { background:#EEF2FF; } .lgi i { width:10px; height:10px; border-radius:3px; }
  .lgi span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .lgi em { font-style:normal; color:var(--mut); text-align:right; font-size:11.5px; }
  .dc { width:100%; height:auto; display:block; } .dc .gl { stroke:#EEF0F3; } .dc .ax { font-size:11px; fill:#94A3B8; }
  .dc .bi { fill:#15803D; } .dc .bo { fill:#334155; } .dc .z { stroke:#94A3B8; stroke-dasharray:4 4; }
  .dc .ln { stroke:#1E3A8A; } .dc circle.pos { fill:#15803D; } .dc circle.neg { fill:#B91C1C; }
  .key { font-size:12px; color:var(--mut); } .key i { display:inline-block; width:9px; height:9px; border-radius:2px; margin:0 4px 0 8px; }
  .key i.bi { background:#15803D; } .key i.bo { background:#334155; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:#E6E8EC; padding:4px; border-radius:12px; }
  .seg button { min-height:38px; border:0; border-radius:9px; background:none; font-weight:800; color:#475569; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(15,23,42,.12); }
  .sq { margin-top:10px; }
  .gp { background:#fff; border:1px solid var(--line); border-radius:12px; margin-top:8px; overflow:hidden; }
  .gp summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:16px minmax(0,1fr) auto; grid-template-areas:"cv gn amt" "cv gb gb"; gap:4px 10px; padding:11px 12px; align-items:center; }
  .gp summary::-webkit-details-marker { display:none; }
  .gp .cv { grid-area:cv; color:#94A3B8; transition:transform .15s; align-self:start; margin-top:2px; } .gp[open] .cv { transform:rotate(90deg); }
  .gp .gn { grid-area:gn; min-width:0; display:flex; flex-direction:column; } .gp .gn b { overflow-wrap:anywhere; } .gp .gn .mut { font-size:12px; }
  .gp summary > b { grid-area:amt; font-size:15px; }
  .gp .gb { grid-area:gb; display:grid; grid-template-columns:1fr 46px; gap:8px; align-items:center; } .gp .gb em { font-style:normal; font-size:11.5px; color:var(--mut); text-align:right; }
  .gc2 { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .ct { font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px; background:color-mix(in srgb, var(--c) 14%, #fff); color:var(--c); }
  .bar { display:block; height:7px; background:#EEF0F3; border-radius:4px; overflow:hidden; } .bar i { display:block; height:100%; border-radius:4px; }
  .gp table, .ct2 { width:100%; border-collapse:collapse; font-size:13px; }
  .gp table { background:#FAFBFC; border-top:1px solid var(--line); table-layout:auto; }
  .gp td:nth-child(2) { width:100%; }
  .gp th, .ct2 th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); padding:7px 10px; }
  .gp td, .ct2 td { padding:7px 10px; border-top:1px solid var(--line); vertical-align:top; }
  .gp tfoot td, .ct2 tfoot td { font-weight:800; border-top:2px solid var(--ink); }
  .r { text-align:right; white-space:nowrap; } .nw { white-space:nowrap; }
  .pic { border:0; background:none; padding:0; cursor:zoom-in; font-size:14px; }
  .t0 { font-size:11px; font-weight:700; color:#64748B; background:#F1F5F9; padding:1px 6px; border-radius:6px; white-space:nowrap; }
  .gt { display:flex; justify-content:space-between; gap:8px; padding:12px; margin-top:8px; border-radius:12px; background:var(--ink); color:#fff; font-weight:700; }
  .br { display:grid; grid-template-columns:minmax(0,1fr) 34% auto 44px; gap:8px; align-items:center; padding:6px 0; border-top:1px solid var(--line); font-size:13px; }
  .br:first-of-type { border-top:0; } .br span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
  .br em { font-style:normal; font-size:11.5px; color:var(--mut); text-align:right; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; }
  .td { border-top:1px solid var(--line); } .td:first-of-type { border-top:0; }
  .td summary { list-style:none; cursor:pointer; display:flex; justify-content:space-between; gap:8px; padding:9px 0; font-size:13px; }
  .td summary::-webkit-details-marker { display:none; } .td summary b { white-space:nowrap; }
  .tdr { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:5px 0 5px 10px; font-size:12.5px; border-top:1px dashed var(--line); }
  .tdr span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hm { }
  @media (max-width: 520px) { .dw { grid-template-columns:1fr; justify-items:center; } .lg { width:100%; } .hm { display:none; } }
  @media (min-width: 1000px) {
    #pStat { max-width:1600px; }
    .kps { grid-template-columns:repeat(4, minmax(0,1fr)); } .kp .kv { font-size:23px; }
    .dns { grid-template-columns:1fr 1fr; } .dw { grid-template-columns:180px 1fr; } .dn { width:180px; height:180px; }
    .stGrid { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr); gap:20px; align-items:start; }
    .tabs.t3 { max-width:480px; }
  }
  @media (min-width: 1000px) and (max-width: 1399px) {
    #pChi { grid-template-columns:minmax(0, 1fr) 360px; grid-template-areas:"side det" "main det" "bot det"; }
    #pChi .side { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; } #pChi .side > .btn { grid-column:1 / -1; }
  }
  /* 🖥️ Thu chi on the computer (owner Nov 25: "rất rối … không biết ngày nào quan trọng, khoản nào cần làm") */
  @media (max-width: 999px) { .det { display:none; } }
  .tbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .tbar input { margin:0; flex:1; min-width:200px; max-width:380px; min-height:40px; font-size:14px; }
  .tbar .chip { min-height:40px; }
  .rib { display:flex; align-items:flex-end; gap:3px; height:112px; padding:10px 12px 6px; background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow-x:auto; }
  .rib .rbh { align-self:flex-start; font-size:12px; font-weight:800; color:var(--mut); writing-mode:vertical-rl; transform:rotate(180deg); margin-right:4px; }
  .rb { flex:1 0 22px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:2px; border:0; background:none; padding:0; cursor:pointer; height:100%; border-radius:6px; }
  .rb:hover { background:#F1F5F9; } .rb.on { background:#FEF3C7; }
  .rb i { width:70%; max-width:26px; background:#475569; border-radius:3px 3px 0 0; } .rb:hover i { background:#0E1525; } .rb.on i { background:#D97706; }

<body>
<div class="wrap">
  <div class="top">
    {% if not share %}<a href="/" aria-label="Về trang chính">‹</a>{% endif %}
    <h1>Nộp & Chi{% if share %} <span class="ro">Chỉ xem</span>{% endif %}</h1>
    {% if not share %}<button class="shr" onclick="Chi.share()">🔗 Chia sẻ</button>{% endif %}
  </div>
  <div id="chips" class="chips"></div>
  <div id="sum" class="card"><div class="mut">Đang tải…</div></div>
  <div class="tabs t3"><button id="tChi" onclick="Chi.tab('chi')">💸 Thu chi</button><button id="tStat" onclick="Chi.tab('stat')">📊 Thống kê</button><button id="tNop" onclick="Chi.tab('nop')">📒 Nộp tiền</button></div>
  <div id="pChi">
    <div class="side">
      {% if not share %}<button class="btn dark" style="width:100%;margin-top:12px" onclick="Chi.add()">➕ Thêm khoản thu / chi</button>{% endif %}
      <div id="chiSum" class="card"></div>
      <div id="led"></div>
      <div id="kinds" class="chips"></div>
      <div id="brk"></div>
    </div>
    <div class="main">
      <div id="flt"></div>
      <div id="list" class="card" style="display:none"></div>
    </div>
    <div id="det" class="det"></div>
    {% if not share %}<div id="bot" class="card"></div>{% endif %}
  </div>
  <div id="pStat" style="display:none"></div>
  <div id="pNop" style="display:none"></div>
  <div id="foot" class="foot"></div>
</div>
<div id="sh" onclick="if(event.target===this)this.style.display='none'"><div class="in" id="shIn"></div></div>
<div id="ov" onclick="this.style.display='none'"><img id="ovImg" alt="Biên lai"></div>
<script>
(() => {
  const SHARE = {{ share|tojson }};      // '' = the owner's page · a secret = the read-only page others open
  const RO = !!SHARE;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => Number(n || 0).toLocaleString('vi-VN') + 'đ';
  const monLbl = (m) => { if (m === 'all') return 'Cả dự án (mọi tháng)'; const [y, mo] = m.split('-'); return 'Tháng ' + Number(mo) + '/' + y; };
  const WD = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  const dayLbl = (d) => { const [y, m, dd] = d.split('-').map(Number); return WD[new Date(y, m - 1, dd).getDay()] + ', ' + dd + '/' + m; };
  const attr = (v) => esc(JSON.stringify(v));
  // the bank's automatic transfer text ("X chuyen khoan nhanh qua Zalo", "… chuyen tien QR") says nothing about the expense
  const AUTO_NOTE = /chuyen (khoan|tien)( nhanh)?( qua zalo| qr)?\s*$/i;
  let month = '', J = null, D = null, F = { apt: null, payer: null, kind: null, day: null, todo: false, q: '', cat: null };
  let TAB = location.hash === '#nop' ? 'nop' : location.hash === '#thong-ke' ? 'stat' : 'chi';
  // 🖥️ computer (owner Nov 24 "Nộp & Chi trên máy tính"): ≥1000px → 2 columns, the list as a table
  const WIDE = matchMedia('(min-width: 1000px)');
  // 🖥️ computer (owner Nov 25: "rất rối … không biết ngày nào quan trọng, khoản nào cần làm"): day bars on top (which days
  // cost most · click = that day), a "Cần làm" strip (items missing who / apartment / hạng mục), the month as ONE compact
  // list grouped by day (one line per item, small picture), and the chosen item's BIG receipt on the right (↑ ↓ to move)
  let SEL = null;
  // 📚 Sổ (owner Nov 25: "tách riêng tiền nhà … đầu tư cố định … còn lại là đầu tư phát sinh … và phần thu chi riêng cho
  // tôi, chỉ mình tôi nhìn thấy"). BOOK = null → both shared books together; 'rieng' is never mixed with the others.
  const BK = {
    nha: { ic: '🏠', name: 'Tiền nhà', sub: 'Đầu tư cố định: tiền thuê, cọc nhà, môi giới · tiền khách thuê, gia đình góp' },
    ps: { ic: '🔨', name: 'Đầu tư phát sinh', sub: 'Vật tư, thợ, mộc, nội thất … và vốn bỏ vào' },
    rieng: { ic: '🔒', name: 'Riêng tôi', sub: 'Chỉ máy đã nhập mã PIN mới thấy' },
  };
  let BOOK = null;
  const IT = () => (J ? J.items.filter((r) => (BOOK ? r.book === BOOK : r.book !== 'rieng')) : []);
  const privOpen = () => !!(J && J.priv && J.priv.open);
  const bookLbl = (b) => (BK[b] ? BK[b].ic + ' ' + BK[b].name : '');
  const catsFor = (b, k) => ((J.bcats && J.bcats[b] && J.bcats[b][k]) || (J.cats && J.cats[k]) || []);
  const lack = (r) => [!r.payer && (r.kind === 'thu' ? 'từ ai' : 'ai trả'), r.kind !== 'thu' && !r.apt && 'căn', !r.cat && 'hạng mục'].filter(Boolean);
  const todayS = () => new Date().toLocaleDateString('sv');
  const dName = (d) => { const t = todayS(), y = new Date(Date.now() - 864e5).toLocaleDateString('sv');
    return (d === t ? 'Hôm nay · ' : d === y ? 'Hôm qua · ' : '') + dayLbl(d); };
  function desk(base, shown) {
    const q = SHARE ? '?t=' + encodeURIComponent(SHARE) : '';
    const tally = (list) => { const o = {}; for (const r of list) { const x = o[r.day] || (o[r.day] = { o: 0, i: 0, n: 0 }); x[r.kind === 'thu' ? 'i' : 'o'] += r.amount; x.n++; } return o; };
    const days = tally(base), dk = Object.keys(days).sort(), top = Math.max(1, ...dk.map((d) => days[d].o));
    const rib = dk.length > 1 ? `<div class="rib"><span class="rbh">Chi theo ngày</span>${dk.map((d) => { const x = days[d];
      return `<button class="rb${F.day === d ? ' on' : ''}${d === todayS() ? ' td' : ''}" onclick="Chi.day('${d}')" title="${esc(dayLbl(d))} · ${x.n} khoản · ra ${money(x.o)}${x.i ? ' · vào ' + money(x.i) : ''}">`
        + `<span class="rbv">${x.o >= top * 0.12 ? tr(x.o).replace(' tr', '') : ''}</span><i style="height:${x.o ? Math.max(3, Math.round(x.o / top * 62)) : 0}px"></i>${x.i ? '<em title="có tiền vào"></em>' : ''}<b>${+d.slice(8)}</b></button>`; }).join('')}</div>` : '';
    const todo = base.filter((r) => lack(r).length), noApt = base.filter((r) => r.kind !== 'thu' && !r.apt);
    const cnt = (w) => todo.filter((r) => lack(r).includes(w)).length;
    const parts = [['ai trả', 'người trả'], ['từ ai', 'người đưa'], ['căn', 'căn'], ['hạng mục', 'hạng mục']].map(([w, l]) => cnt(w) ? `thiếu ${l}: ${cnt(w)}` : '').filter(Boolean).join(' · ');
    const ban = !RO && todo.length ? `<div class="todo"><div><b>⚠️ Cần làm · ${todo.length} khoản chưa đủ thông tin</b><span>${parts}</span></div>
      <button class="${F.todo ? 'on' : ''}" onclick="Chi.todo()">${F.todo ? '✓ Đang xem khoản thiếu · bỏ lọc' : 'Chỉ xem khoản thiếu'}</button>
      ${noApt.length >= 3 ? `<select onchange="Chi.bulkApt(this)"><option value="">🏠 Gán căn cho ${noApt.length} khoản chưa chọn căn…</option>${J.apts.map((o) => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>` : ''}</div>` : '';
    const kc = (k, l) => `<button class="chip${F.kind === k ? ' on' : ''}" onclick="Chi.kind(${k ? `'${k}'` : 'null'})">${l}</button>`;
    const nThu = IT().filter((r) => r.kind === 'thu').length;
    const bar = `<div class="tbar"><input id="dQ" placeholder="🔍 Tìm người nhận, nội dung, số tiền…" value="${esc(F.q)}" autocomplete="off" oninput="Chi.q(this.value)">
      ${kc(null, 'Tất cả · ' + IT().length)}${kc('thu', '⬇️ Thu · ' + nThu)}${kc('chi', '⬆️ Chi · ' + (IT().length - nThu))}
      ${F.day ? `<button class="chip on" onclick="Chi.day('${F.day}')">📅 ${esc(dayLbl(F.day))} ✕</button>` : ''}</div>`;
    const sums = tally(shown);
    let html = '', cur = '';
    for (const r of shown) {
      if (r.day !== cur) {
        if (cur) html += '</div>';
        cur = r.day; const x = sums[cur];
        html += `<div class="dh2"><b>${esc(dName(cur))}</b><span>${x.n} khoản</span>${x.i ? `<span class="pos">Vào +${money(x.i)}</span>` : ''}${x.o ? `<span class="ra">Ra ${money(x.o)}</span>` : ''}</div><div class="tb">`;
      }
      const v = view(r), thu = r.kind === 'thu';
      const chip = (txt, emp) => txt ? `<span class="c2">${esc(txt)}</span>` : RO ? '' : `<span class="c2 miss">+ ${emp}</span>`;
      html += `<div class="rw${SEL === r.id ? ' on' : ''}" id="rw${r.id}" onclick="Chi.sel(${r.id})">
        ${r.img ? `<img class="th" src="/api/chi/img/${r.id}${q}" loading="lazy" alt="">` : '<div class="th v">🎤</div>'}
        <span class="tm">${esc(r.at.split(' ')[0])}</span>
        <div class="wt"><b>${esc(v.title)}</b><small>${esc(v.sub || v.said || '')}</small></div>
        <div class="cs">${!BOOK && r.book === 'nha' ? '<span class="c2 bkn">🏠 Tiền nhà</span>' : ''}${chip(r.cat, 'hạng mục')}${!thu || r.apt ? chip(r.apt, 'căn') : ''}${chip(r.payer, thu ? 'từ ai' : 'ai trả')}</div>
        <b class="am${thu ? ' in' : ''}${!thu && r.amount >= 5e6 ? ' big' : ''}">${thu ? '+' : ''}${money(r.amount)}</b></div>`;
    }
    // Σ of everything listed (owner Nov 25: "hiển thị một con số tổng cộng hết những khoản này")
    const sO = shown.filter((r) => r.kind !== 'thu').reduce((a, r) => a + r.amount, 0), sI = shown.filter((r) => r.kind === 'thu').reduce((a, r) => a + r.amount, 0);
    const what = [F.day ? dayLbl(F.day) : '', F.todo ? 'khoản thiếu' : '', F.q ? '“' + F.q + '”' : ''].filter(Boolean).join(' · ');
    const tot = shown.length ? `<div class="sumL"><span>Tổng cộng ${shown.length} khoản${what ? ' · ' + esc(what) : ''}</span>${sI ? `<span class="pos">Vào +${money(sI)}</span>` : ''}${sO ? `<span>Ra <b>${money(sO)}</b></span>` : ''}${sI && sO ? `<span>Vào − ra <b class="${sI - sO < 0 ? 'neg' : 'pos'}">${sI - sO < 0 ? '−' : ''}${money(Math.abs(sI - sO))}</b></span>` : ''}</div>` : '';
    return bar + rib + ban + tot + (html ? html + '</div>' + tot : `<div class="card mut">Không có khoản nào${F.q || F.day || F.todo ? ' khớp bộ lọc' : ''}.</div>`);
  }
  function det() {
    const el = $('det'); if (!el || !J) return;
    const r = J.items.find((x) => x.id === SEL);
    if (!r) { el.innerHTML = '<div class="mut" style="padding:40px 10px;text-align:center">Bấm một khoản ở giữa để xem biên lai to.</div>'; return; }
    const v = view(r), thu = r.kind === 'thu', q = SHARE ? '?t=' + encodeURIComponent(SHARE) : '';
    const f = (key, lbl, txt, emp) => `<div class="df"><span>${lbl}</span>${RO ? `<b>${esc(txt || '—')}</b>` : `<button class="lnk${txt ? '' : ' none'}" onclick="Chi.pick(${r.id}, '${key}')">${esc(txt || emp)}</button>`}</div>`;
    el.innerHTML = `<div class="dtop"><button onclick="Chi.step(-1)" title="Khoản trước (phím ↑)">↑</button><button onclick="Chi.step(1)" title="Khoản sau (phím ↓)">↓</button>
        <span class="mut"><b style="color:var(--ink)">${esc(dName(r.day))}</b> · ${esc(r.at.split(' ')[0])}${thu ? ' · <span class="pill">Thu</span>' : ''}</span></div>
      <div class="dam${thu ? ' in' : ''}" style="margin-top:0">${thu ? '+' : ''}${money(r.amount)}</div>
      <div class="dwho">${esc(v.title)}</div>${v.sub ? `<div class="dnd">${esc(v.sub)}</div>` : ''}
      <div class="dfs">${f('book', 'Sổ', bookLbl(r.book), 'Chọn sổ')}${f('payer', thu ? 'Từ ai' : 'Ai trả', r.payer, 'Chọn người')}${f('apt', 'Căn', r.apt, 'Chọn căn')}${f('cat', 'Hạng mục', r.cat, 'Chọn hạng mục')}</div>

  // ── 📊 Thống kê (owner Nov 24: "thống kê chi tiết nhất, biểu đồ, bóc tách từng thứ … dùng cho những giao dịch mới nữa") ──
  // Everything is computed here from J.items (the month shown, or "Cả dự án" = every month), so a new receipt shows up

  const PAL = ['#1E3A8A', '#0F766E', '#B45309', '#7C3AED', '#BE123C', '#15803D', '#0369A1', '#A16207', '#64748B'];
  let S = { kind: 'chi', cat: null, q: '' };

  }

      off += ln;

  }
  function legend(parts, total, kind) {

  function dayChart(items) {

    if (byMonth) { for (const r of items) { const k = r.day.slice(0, 7); if (!keys.includes(k)) keys.push(k); } keys.sort(); }

    const IN = {}, OUT = {};
    for (const r of items) { const k = byMonth ? r.day.slice(0, 7) : r.day; (r.kind === 'thu' ? IN : OUT)[k] = ((r.kind === 'thu' ? IN : OUT)[k] || 0) + r.amount; }
    const top = Math.max(1, ...keys.map((k) => Math.max(IN[k] || 0, OUT[k] || 0)));
    const W = WIDE.matches ? 900 : 420, H = WIDE.matches ? 190 : 170, P = WIDE.matches ? 40 : 34, bw = (W - P - 8) / keys.length;   // phone: text stays readable
    let s = `<svg viewBox="0 0 ${W} ${H + 30}" class="dc">`;
    for (let g = 0; g <= 4; g++) {

      s += `<line x1="${P}" x2="${W - 4}" y1="${y}" y2="${y}" class="gl"/><text x="${P - 6}" y="${y + 4}" text-anchor="end" class="ax">${tr(top * (1 - g / 4)).replace(' tr', '')}</text>`;
    }
    keys.forEach((k, i) => {
      const x = P + bw * i;
      [[IN[k] || 0, 'bi', 'Thu'], [OUT[k] || 0, 'bo', 'Chi']].forEach(([v, cls, lab], j) => {
        const h = (H - 8) * v / top;
        if (v) s += `<rect x="${(x + bw * 0.12 + j * bw * 0.38).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw * 0.36).toFixed(1)}" height="${h.toFixed(1)}" rx="2" class="${cls}"><title>${esc(k)} · ${lab}: ${money(v)}</title></rect>`;
      });

  }
