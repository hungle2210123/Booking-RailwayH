<!DOCTYPE html>
<html>
<head>
    <title>Test Collector Date Picker UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Test: Collector Date Picker UI</h2>
        
        <!-- Copy of the exact collector section -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-light">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-0">
                            <i class="fas fa-chart-pie me-1 text-primary"></i> 
                            Phân bổ theo Người thu (Chi tiết)
                        </h6>
                        <small class="text-muted">✅ Validation: CHỈ LOC LE & THAO LE</small>
                    </div>
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <div class="d-flex align-items-center gap-1">
                            <label class="form-label mb-0 text-muted small">
                                <i class="fas fa-calendar-alt me-1"></i>Loại:
                            </label>
                            <select id="collectorDateType" class="form-select form-select-sm" style="width: 120px;" onchange="toggleCollectorDatePicker()">
                                <option value="month">Theo tháng</option>
                                <option value="custom">Tùy chọn</option>
                                <option value="all">Tất cả</option>
                            </select>
                        </div>
                        
                        <div id="collectorMonthContainer" class="d-flex align-items-center gap-1">
                            <label for="collectorMonthSelect" class="form-label mb-0 text-muted small">Tháng:</label>
                            <select id="collectorMonthSelect" class="form-select form-select-sm" style="width: 120px;">
                                <option value="current">Tháng hiện tại</option>
                                <option value="2025-07">Tháng 7/2025</option>
                                <option value="2025-06">Tháng 6/2025</option>
                            </select>
                        </div>
                        
                        <div id="collectorCustomDateContainer" class="d-none d-flex align-items-center gap-2">
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label mb-0 text-muted small">Từ:</label>
                                <input type="date" id="collectorStartDate" class="form-control form-control-sm" style="width: 140px;">
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label mb-0 text-muted small">Đến:</label>
                                <input type="date" id="collectorEndDate" class="form-control form-control-sm" style="width: 140px;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <p>This is a test of the collector date picker interface.</p>
                <div id="status" class="alert alert-info"></div>
            </div>
        </div>
    </div>

    <script>
        function toggleCollectorDatePicker() {
            const dateType = document.getElementById('collectorDateType').value;
            const monthContainer = document.getElementById('collectorMonthContainer');
            const customContainer = document.getElementById('collectorCustomDateContainer');
            const status = document.getElementById('status');
            
            console.log('Toggling to:', dateType);
            
            if (dateType === 'month') {
                monthContainer.classList.remove('d-none');
                monthContainer.style.display = 'block';
                customContainer.classList.add('d-none');
                customContainer.style.display = 'none';
                status.innerHTML = '📅 Showing month selector';
            } else if (dateType === 'custom') {
                monthContainer.classList.add('d-none');
                monthContainer.style.display = 'none';
                customContainer.classList.remove('d-none');
                customContainer.style.display = 'block';
                
                // Set default dates
                const startDate = document.getElementById('collectorStartDate');
                const endDate = document.getElementById('collectorEndDate');
                const today = new Date();
                const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                
                startDate.value = firstDay.toISOString().split('T')[0];
                endDate.value = today.toISOString().split('T')[0];
                
                status.innerHTML = '✅ CUSTOM DATE PICKER VISIBLE!<br>📅 Start: ' + startDate.value + '<br>📅 End: ' + endDate.value;
            } else if (dateType === 'all') {
                monthContainer.classList.add('d-none');
                monthContainer.style.display = 'none';
                customContainer.classList.add('d-none');
                customContainer.style.display = 'none';
                status.innerHTML = '📅 Showing all time (no date controls)';
            }
        }
        
        // Initialize
        toggleCollectorDatePicker();
        
        // Test function
        window.testToggle = function() {
            document.getElementById('collectorDateType').value = 'custom';
            toggleCollectorDatePicker();
        }
        
        console.log('🧪 Test page loaded. Call testToggle() to test custom date picker.');
    </script>
</body>
</html>
