[build]
builder = "dockerfile"

[deploy]
startCommand = "python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[variables]
# Railway will automatically inject these
PORT = { default = "5000" }
PYTHONPATH = "/app"
FLASK_APP = "app.py"
DATABASE_SOURCE = "auto"